<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wachtwoord herstellen — Iveras</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/iveras-public.css') }}">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 100%; max-width: 420px; }
        h1 { color: #1a1a2e; margin-bottom: 0.75rem; text-align: center; }
        p { color: #64748b; line-height: 1.5; margin-bottom: 1.25rem; text-align: center; }
        label { display: block; margin-bottom: 0.5rem; color: #555; font-weight: 500; }
        input { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; margin-bottom: 1rem; }
        .btn { width: 100%; padding: 0.75rem; background: #16213e; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: 500; }
        .back { display: block; text-align: center; margin-top: 1rem; color: #16213e; }
    </style>
</head>
<body class="iveras-auth-page">
    <main class="container iveras-auth-card">
        <a class="iveras-auth-brand" href="/public"><span class="iveras-auth-mark">I</span>Iveras</a>
        <h1>Wachtwoord herstellen</h1>
        <p>Vul uw e-mailadres in. Als er een actief account bestaat, ontvangt u een eenmalige herstel-link.</p>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label class="iveras-auth-label" for="email">E-mailadres</label>
            <input type="email" id="email" name="email" required autocomplete="email">
            <button class="btn iveras-auth-button" type="submit">Herstelmail aanvragen</button>
        </form>
        <a class="back iveras-auth-link" href="{{ url_for('auth.login') }}">Terug naar inloggen</a>
    </main>
</body>
</html>
