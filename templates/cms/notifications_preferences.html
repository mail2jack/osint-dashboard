{% extends "cms/base.html" %}
{% block title %}{{ _('Notification Preferences') }} — CMS{% endblock %}
{% block content %}
<style>
.pref-card {
    background:var(--card-bg);border:1px solid var(--border-color);border-radius:8px;padding:1rem;margin-bottom:0.75rem;
}
.pref-card h3 { margin:0 0 0.25rem;font-size:0.9rem; }
.pref-card .desc { font-size:0.8rem;color:var(--text-secondary);margin-bottom:0.75rem; }
.toggle-row { display:flex;gap:1.5rem;align-items:center; }
.toggle-row label { display:flex;align-items:center;gap:0.4rem;font-size:0.85rem;cursor:pointer; }
.toggle-row input[type="checkbox"] { width:1rem;height:1rem;cursor:pointer; }
</style>
<style>
.prefs-workspace{max-width:1400px;margin:0 auto}.prefs-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:1rem;align-items:start}.prefs-nav{padding:.7rem;background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;position:sticky;top:1rem}.prefs-nav-title{padding:.55rem .65rem .8rem;font-weight:800;border-bottom:1px solid var(--border-color);margin-bottom:.45rem}.prefs-nav-section{margin:.25rem 0 .55rem}.prefs-nav-section h2{margin:.5rem .65rem .25rem;font-size:.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em}.prefs-nav a{display:flex;align-items:center;border-radius:7px;padding:.55rem .65rem;color:var(--text-secondary);text-decoration:none;font-size:.82rem}.prefs-nav a:hover,.prefs-nav a.active{background:var(--info-bg,#eff6ff);color:var(--accent-primary)}.prefs-main{min-width:0}.prefs-header{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;padding:1rem;background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;margin-bottom:.75rem}.prefs-header h1{margin:0;font-size:1.35rem}.prefs-lead{color:var(--text-secondary);margin:.4rem 0 0}.prefs-main .pref-card{background:var(--bg-card);border-radius:12px;padding:1rem;margin-bottom:.7rem}.prefs-main .pref-card h3{font-size:.95rem}.prefs-main .toggle-row{gap:1.5rem;flex-wrap:wrap}.prefs-actions{display:flex;align-items:center;gap:.75rem;margin-top:1rem}@media(max-width:900px){.prefs-layout{grid-template-columns:1fr}.prefs-nav{position:static}}
</style>

<div class="prefs-main">
<div class="prefs-header"><div><h1>⚙️ {{ _('Notification Preferences') }}</h1><p class="prefs-lead">{{ _('Choose which notification types you receive and how.') }}</p></div><a href="{{ url_for('cms.notification_history') }}" class="btn-cms">← {{ _('Back to Notifications') }}</a></div>

<div id="prefList"></div>

<div class="prefs-actions">
    <button class="btn-cms" id="savePrefs">{{ _('Save Preferences') }}</button>
    <span id="saveStatus" style="margin-left:0.5rem;font-size:0.8rem;color:var(--text-muted);"></span>
</div>
</div>

<script nonce="{{ csp_nonce }}">
function loadPrefs() {
    fetch('/cms/api/notifications/preferences')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var h = '';
            data.preferences.forEach(function(p) {
                var catLabel = p.label;
                h += '<div class="pref-card">';
                h += '<h3>' + catLabel + '</h3>';
                h += '<div class="toggle-row">';
                h += '<label><input type="checkbox" class="pref-web" data-category="' + p.category + '"' + (p.web_enabled ? ' checked' : '') + '> {{ _("In-app") }}</label>';
                h += '<label><input type="checkbox" class="pref-email" data-category="' + p.category + '"' + (p.email_enabled ? ' checked' : '') + '> 📧 {{ _("Email") }}</label>';
                h += '<label><input type="checkbox" class="pref-sms" data-category="' + p.category + '"' + (p.sms_enabled ? ' checked' : '') + '> 💬 {{ _("SMS") }}</label>';
                h += '<label><input type="checkbox" class="pref-whatsapp" data-category="' + p.category + '"' + (p.whatsapp_enabled ? ' checked' : '') + '> 📱 {{ _("WhatsApp") }}</label>';
                h += '</div></div>';
            });
            document.getElementById('prefList').innerHTML = h;
        });
}

document.getElementById('savePrefs').addEventListener('click', function() {
    var status = document.getElementById('saveStatus');
    status.textContent = '{{ _("Saving...") }}';
    var prefs = [];
    document.querySelectorAll('.pref-card').forEach(function(card) {
        var web = card.querySelector('.pref-web');
        var email = card.querySelector('.pref-email');
        var sms = card.querySelector('.pref-sms');
        var whatsapp = card.querySelector('.pref-whatsapp');
        if (web) {
            prefs.push({
                category: web.dataset.category,
                web_enabled: web.checked,
                email_enabled: email ? email.checked : false,
                sms_enabled: sms ? sms.checked : false,
                whatsapp_enabled: whatsapp ? whatsapp.checked : false,
            });
        }
    });
    apiFetch('/cms/api/notifications/preferences', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ preferences: prefs }),
    }).then(function() {
        status.textContent = '{{ _("Saved") }}';
        status.style.color = '#10b981';
        setTimeout(function() { status.textContent = ''; }, 2000);
    }).catch(function() {
        status.textContent = '{{ _("Error saving") }}';
        status.style.color = '#ef4444';
    });
});

loadPrefs();
</script>
{% endblock %}
