<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} - {{ title }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: white; padding: 3rem; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 100%; max-width: 480px; text-align: center; }
        .code { font-size: 4rem; font-weight: 800; color: #1a1a2e; line-height: 1; margin-bottom: 0.5rem; }
        .title { font-size: 1.25rem; color: #555; margin-bottom: 1.5rem; }
        .message { color: #777; margin-bottom: 2rem; }
        .btn { display: inline-block; padding: 0.75rem 1.5rem; background: #16213e; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; text-decoration: none; }
        .btn:hover { background: #1a1a2e; }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">{{ code }}</div>
        <div class="title">{{ title }}</div>
        <div class="message">{{ message }}</div>
        <a href="/cms/" class="btn">Back to Dashboard</a>
    </div>
</body>
</html>
