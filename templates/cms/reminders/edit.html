{% extends "cms/base.html" %}
{% block content %}
<style>
    .form-group { margin-bottom: 1rem; }
    .form-group label {
        display: block;
        margin-bottom: 0.25rem;
        font-weight: 600;
        color: var(--text-primary);
    }
    .form-group input, .form-group select, .form-group textarea {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid var(--border-input);
        border-radius: 4px;
        background: var(--bg-card);
        color: var(--text-primary);
        font-size: 0.9rem;
    }
    .form-group textarea { min-height: 100px; }
    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
    }
    .checkbox-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    .checkbox-group input[type="checkbox"] {
        width: auto;
    }
</style>

<div style="max-width: 600px; margin: 0 auto;">
    <div style="margin-bottom: 1rem;">
        <a href="{{ url_for('cms.reminders') }}" style="color: var(--link-color); text-decoration: none; font-size: 0.85rem;">← Back to Reminders</a>
        <span style="color: var(--text-secondary);"> | </span>
        <a href="{{ url_for('cms.view_reminder', reminder_id=reminder.id) }}" style="color: var(--link-color); text-decoration: none; font-size: 0.85rem;">View Reminder</a>
    </div>
    
    <div class="card">
        <h2 style="margin-top: 0;">Edit Reminder</h2>
        
<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
        <label for="title">Title *</label>
                <input type="text" id="title" name="title" required value="{{ reminder.title }}">
            </div>
            
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description">{{ reminder.description or '' }}</textarea>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="reminder_date">Reminder Date & Time *</label>
                    <input type="datetime-local" id="reminder_date" name="reminder_date" required 
                           value="{{ reminder.reminder_date.strftime('%Y-%m-%dT%H:%M') if reminder.reminder_date else '' }}">
                </div>
                <div class="form-group">
                    <label for="due_date">Due Date</label>
                    <input type="date" id="due_date" name="due_date" 
                           value="{{ reminder.due_date.strftime('%Y-%m-%d') if reminder.due_date else '' }}">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select id="priority" name="priority">
                        <option value="low" {% if reminder.priority == 'low' %}selected{% endif %}>Low</option>
                        <option value="medium" {% if reminder.priority == 'medium' %}selected{% endif %}>Medium</option>
                        <option value="high" {% if reminder.priority == 'high' %}selected{% endif %}>High</option>
                        <option value="critical" {% if reminder.priority == 'critical' %}selected{% endif %}>Critical</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="assigned_to">Assign To</label>
                    <select id="assigned_to" name="assigned_to">
                        <option value="">-- Unassigned --</option>
                        {% for user in users %}
                        <option value="{{ user.id }}" {% if reminder.assigned_to == user.id %}selected{% endif %}>
                            {{ user.full_name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="reminder_type">Type</label>
                    <select id="reminder_type" name="reminder_type">
                        <option value="manual" {% if reminder.reminder_type == 'manual' %}selected{% endif %}>Manual</option>
                        <option value="recurring" {% if reminder.reminder_type == 'recurring' %}selected{% endif %}>Recurring</option>
                        <option value="system" {% if reminder.reminder_type == 'system' %}selected{% endif %}>System</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="recurrence">Recurrence</label>
                    <select id="recurrence" name="recurrence">
                        <option value="none" {% if reminder.recurrence == 'none' %}selected{% endif %}>None</option>
                        <option value="daily" {% if reminder.recurrence == 'daily' %}selected{% endif %}>Daily</option>
                        <option value="weekly" {% if reminder.recurrence == 'weekly' %}selected{% endif %}>Weekly</option>
                        <option value="monthly" {% if reminder.recurrence == 'monthly' %}selected{% endif %}>Monthly</option>
                        <option value="quarterly" {% if reminder.recurrence == 'quarterly' %}selected{% endif %}>Quarterly</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group checkbox-group">
                <input type="checkbox" id="notify_dashboard" name="notify_dashboard" 
                       {% if reminder.notify_dashboard %}checked{% endif %}>
                <label for="notify_dashboard" style="margin: 0;">Show on dashboard</label>
            </div>
            
            <div style="display: flex; gap: 0.5rem; margin-top: 1.5rem;">
                <button type="submit" class="btn" style="background: var(--accent-primary);">Save Changes</button>
                <a href="{{ url_for('cms.view_reminder', reminder_id=reminder.id) }}" class="btn" style="background: #666;">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
