{% extends "cms/base.html" %}
{% block title %}Active Sessions{% endblock %}

{% block content %}
<div class="page-header">
    <h1>🔐 Active Sessions</h1>
    <p style="color: var(--text-secondary);">Manage active server-side sessions. Revoke sessions to force logout.</p>
</div>

<div class="card" style="padding: 1.5rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <span id="sessionCount" style="font-weight: 600;"></span>
        <button type="button" data-click="deleteAllSessions" class="btn-cms danger">Delete All (except mine)</button>
    </div>

    <table class="data-table">
        <thead>
            <tr>
                <th>Session ID</th>
                <th>User ID</th>
                <th>IP</th>
                <th>Current</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="sessionsBody">
            <tr><td colspan="5" style="text-align: center; padding: 2rem; color: var(--text-secondary);">Loading...</td></tr>
        </tbody>
    </table>
</div>

<script nonce="{{ csp_nonce }}">
async function loadSessions() {
    try {
        const r = await apiFetch('/cms/admin/sessions');
        const d = await r.json();
        const tbody = document.getElementById('sessionsBody');
        document.getElementById('sessionCount').textContent = d.count + ' active session(s)';

        if (!d.sessions.length) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 2rem; color: var(--text-secondary);">No active sessions.</td></tr>';
            return;
        }

        tbody.innerHTML = d.sessions.map(s => {
            const sid = s.session_id ? s.session_id.slice(0, 16) + '...' : '-';
            const currentBadge = s.is_current ? '<span style="color: #059669;">✓ Current</span>' : '';
            const revokeCell = s.is_current ? '—' : '<button type="button" data-click="deleteSession" data-arg0="' + esc(s.session_id) + '" class="btn-cms danger small">Revoke</button>';
            return '<tr>' +
                '<td><code>' + esc(sid) + '</code></td>' +
                '<td>' + esc(s.user_id || '-') + '</td>' +
                '<td>' + esc(s.ip || '-') + '</td>' +
                '<td>' + currentBadge + '</td>' +
                '<td>' + revokeCell + '</td></tr>';
        }).join('');
    } catch (e) {
        document.getElementById('sessionsBody').innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 2rem; color: var(--danger-text);">Failed to load sessions: ' + esc(e.message) + '</td></tr>';
    }
}

window.deleteSession = async function(btn, id) {
    if (!confirm('Revoke this session? The user will be logged out.')) return;
    try {
        const r = await apiFetch('/cms/admin/sessions/' + id + '/delete', { method: 'POST', headers: {'X-CSRFToken': '{{ csrf_token() }}'} });
        if (r.ok) {
            loadSessions();
        } else {
            const d = await r.json();
            showToast('Failed: ' + (d.error || 'Unknown error'), 'error');
        }
    } catch (e) {
        showToast('Failed: ' + e.message, 'error');
    }
};

window.deleteAllSessions = async function() {
    if (!confirm('Revoke ALL sessions except your current one? All other users will be logged out.')) return;
    try {
        const r = await apiFetch('/cms/admin/sessions/delete-all', { method: 'POST', headers: {'X-CSRFToken': '{{ csrf_token() }}'} });
        const d = await r.json();
        if (r.ok) {
            showToast('Deleted ' + d.deleted + ' sessions', 'success');
            loadSessions();
        } else {
            showToast('Failed: ' + (d.error || 'Unknown'), 'error');
        }
    } catch (e) {
        showToast('Failed: ' + e.message, 'error');
    }
};

function showToast(msg, type) {
    const t = document.getElementById('toast') || (() => {
        const el = document.createElement('div');
        el.id = 'toast';
        el.className = 'toast';
        document.body.appendChild(el);
        return el;
    })();
    t.textContent = msg;
    t.className = 'toast ' + type + ' show';
    setTimeout(() => t.classList.remove('show'), 3000);
}

document.addEventListener('DOMContentLoaded', loadSessions);
</script>
{% endblock %}
