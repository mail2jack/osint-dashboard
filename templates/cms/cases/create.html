{% extends "cms/base.html" %}
{% block content %}
<h2 style="margin-bottom: 1.5rem;">Create New Case</h2>
<form method="POST">
    <div class="form-group">
        <label for="title">Case Title *</label>
        <input type="text" name="title" id="title" required>
    </div>
    <div class="form-group">
        <label for="client_id">Client *</label>
        <select name="client_id" id="client_id" required>
            <option value="">Select a client</option>
            {% for client in clients %}
            <option value="{{ client.id }}">{{ client.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="description">Description</label>
        <textarea name="description" id="description" rows="4" style="width:100%;padding:0.75rem;border:1px solid #ddd;border-radius:8px;"></textarea>
    </div>
    <div class="form-group">
        <label for="priority">Priority</label>
        <select name="priority" id="priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
        </select>
    </div>
    <div class="form-group">
        <label for="case_type">Case Type</label>
        <input type="text" name="case_type" id="case_type" placeholder="e.g., fraud, due_diligence">
    </div>
    <button type="submit" class="btn">Create Case</button>
    <a href="{{ url_for('cms.cases') }}" class="btn" style="background:#666;margin-left:0.5rem;">Cancel</a>
</form>
{% endblock %}
