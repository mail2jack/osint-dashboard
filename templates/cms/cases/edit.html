{% extends "cms/base.html" %}
{% block content %}
<h2 style="margin-bottom: 1.5rem;">Edit Case</h2>
<form method="POST">
    <div class="form-group">
        <label for="title">Case Title *</label>
        <input type="text" name="title" id="title" value="{{ case.title }}" required>
    </div>
    
    <div class="form-group">
        <label for="description">Description</label>
        <textarea name="description" id="description" rows="4" style="width:100%;padding:0.75rem;border:1px solid #ddd;border-radius:8px;">{{ case.description or '' }}</textarea>
    </div>
    
    <div class="form-group">
        <label for="priority">Priority</label>
        <select name="priority" id="priority">
            <option value="low" {% if case.priority == 'low' %}selected{% endif %}>Low</option>
            <option value="medium" {% if case.priority == 'medium' %}selected{% endif %}>Medium</option>
            <option value="high" {% if case.priority == 'high' %}selected{% endif %}>High</option>
            <option value="critical" {% if case.priority == 'critical' %}selected{% endif %}>Critical</option>
        </select>
    </div>
    
    <div class="form-group">
        <label for="case_type">Case Type</label>
        <input type="text" name="case_type" id="case_type" value="{{ case.case_type or '' }}">
    </div>
    
    <div class="form-group">
        <label for="jurisdiction">Jurisdiction</label>
        <input type="text" name="jurisdiction" id="jurisdiction" value="{{ case.jurisdiction or '' }}">
    </div>
    
    <div class="form-group">
        <label for="target_end_date">Target End Date</label>
        <input type="date" name="target_end_date" id="target_end_date" value="{{ case.target_end_date.strftime('%Y-%m-%d') if case.target_end_date else '' }}">
    </div>
    
    <button type="submit" class="btn">Save Changes</button>
    <a href="{{ url_for('cms.view_case', case_id=case.id) }}" class="btn" style="background:#666;margin-left:0.5rem;">Cancel</a>
</form>
{% endblock %}
