{% extends "cms/base.html" %}
{% block title %}{{ 'Aankondiging bewerken' if announcement else 'Nieuwe aankondiging' }}{% endblock %}
{% block content %}
<style>
  .af-form { max-width:700px; }
  .af-form label { display:block; font-size:0.82rem; font-weight:600; margin-bottom:0.25rem; color:var(--text-secondary); }
  .af-form input, .af-form select, .af-form textarea { width:100%; padding:0.5rem; border:1px solid var(--border-color); border-radius:6px; font-size:0.88rem; background:var(--bg-card); color:var(--text-primary); }
  .af-form textarea { min-height:200px; resize:vertical; }
  .af-form .form-group { margin-bottom:1rem; }
</style>

<div class="ann-header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
  <h1>{{ '✏️ Aankondiging bewerken' if announcement else '➕ Nieuwe aankondiging' }}</h1>
  <a href="{{ url_for('cms.list_announcements') }}" class="btn-cms small">← Terug</a>
</div>

<form method="POST" class="af-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group">
    <label for="title">Titel *</label>
    <input type="text" id="title" name="title" value="{{ announcement.title if announcement else '' }}" required>
  </div>
  <div class="form-group">
    <label for="severity">Ernst</label>
    <select id="severity" name="severity">
      <option value="info" {% if announcement and announcement.severity == 'info' %}selected{% endif %}>ℹ️ Info</option>
      <option value="warning" {% if announcement and announcement.severity == 'warning' %}selected{% endif %}>⚠️ Waarschuwing</option>
      <option value="error" {% if announcement and announcement.severity == 'error' %}selected{% endif %}>❌ Fout</option>
      <option value="critical" {% if announcement and announcement.severity == 'critical' %}selected{% endif %}>🔴 Kritiek</option>
    </select>
  </div>
  <div class="form-group">
    <label for="body">Bericht *</label>
    <textarea id="body" name="body" required>{{ announcement.body if announcement else '' }}</textarea>
  </div>
  <div class="form-group">
    <label for="expires_at">Vervaldatum (optioneel, leeg = nooit)</label>
    <input type="datetime-local" id="expires_at" name="expires_at" value="{{ announcement.expires_at.strftime('%Y-%m-%dT%H:%M') if announcement and announcement.expires_at else '' }}">
  </div>
  <div style="display:flex;gap:0.5rem;">
    <button type="submit" class="btn-cms primary">{{ 'Opslaan' if announcement else 'Aanmaken' }}</button>
    <a href="{{ url_for('cms.list_announcements') }}" class="btn-cms">Annuleren</a>
  </div>
</form>
{% endblock %}
