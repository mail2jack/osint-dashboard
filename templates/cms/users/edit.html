{% extends "cms/base.html" %}
{% block title %}Edit User — CMS{% endblock %}
{% block content %}
    <div class="back"><a href="{{ url_for('users.view_user', user_id=user.id) }}">← Back to User</a></div>
    
    <h1>Edit User</h1>

    <div class="card" style="max-width:500px;">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" value="{{ user.full_name }}">
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ user.email }}">
            </div>
            
            {% if current_user.is_admin %}
            <div class="section-title" style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-muted);margin:1.5rem 0 0.75rem;padding-top:1rem;border-top:1px solid var(--border-color);">Admin Options</div>
            
            <div class="form-group">
                <label for="role">Role</label>
                <select id="role" name="role">
                    <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
                    <option value="senior_investigator" {% if user.role == 'senior_investigator' %}selected{% endif %}>Senior Investigator</option>
                    <option value="investigator" {% if user.role == 'investigator' %}selected{% endif %}>Investigator</option>
                    <option value="junior_investigator" {% if user.role == 'junior_investigator' %}selected{% endif %}>Junior Investigator</option>
                    <option value="viewer" {% if user.role == 'viewer' %}selected{% endif %}>Viewer</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="is_active">Status</label>
                <select id="is_active" name="is_active">
                    <option value="1" {% if user.is_active %}selected{% endif %}>Active</option>
                    <option value="0" {% if not user.is_active %}selected{% endif %}>Inactive</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="password">New Password (leave blank to keep current)</label>
                <input type="password" id="password" name="password" minlength="8">
            </div>
            {% endif %}
            
            <div class="btn-group" style="margin:1.5rem 0 0;">
                <button type="submit" class="btn-cms primary">Save Changes</button>
                <a href="{{ url_for('users.view_user', user_id=user.id) }}" class="btn-cms">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}
