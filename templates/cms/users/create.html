{% extends "cms/base.html" %}
{% block title %}Create User — CMS{% endblock %}
{% block content %}
    <div class="back"><a href="{{ url_for('users.list_users') }}">← Back to Users</a></div>
    
    <h1>Create New User</h1>

    <div class="card">
        <form method="POST" id="createUserForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text" id="username" name="username" required value="{{ username or '' }}">
            </div>
            
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required value="{{ email or '' }}">
            </div>
            
            <div class="form-group">
                <label for="full_name">Full Name *</label>
                <input type="text" id="full_name" name="full_name" required value="{{ full_name or '' }}">
            </div>
            
            <div class="form-group">
                <label for="password">Generated Password *</label>
                <div class="pw-wrapper">
                    <input type="password" id="password" name="password" value="{{ generated_password }}" readonly required>
                    <button type="button" class="btn-icon" id="togglePassword" title="Toggle password visibility" data-click="togglePw">👁️</button>
                    <button type="button" class="btn-icon" id="regeneratePassword" title="Generate new password" data-click="generatePw">🔄</button>
                </div>
            </div>

            <div class="delivery-options" style="margin-top:0.5rem;padding:1rem;background:var(--bg-secondary);border-radius:8px;border:1px solid var(--border-color);">
                <div class="section-title" style="margin-top:0;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-muted);">Delivery Options</div>
                <div class="checkbox-group" style="margin-top:1rem;">
                    <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;margin-bottom:0.5rem;">
                        <input type="checkbox" name="send_email" value="1" id="sendEmail">
                        Send credentials via email
                    </label>
                    <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;margin-bottom:0.5rem;">
                        <input type="checkbox" name="send_sms" value="1" id="sendSMS">
                        Send credentials via SMS (coming soon)
                    </label>
                </div>
            </div>
            
            <div class="form-group">
                <label for="role">Role *</label>
                <select id="role" name="role" required>
                    <option value=""{% if not role %} selected{% endif %}>Select a role...</option>
                    <option value="admin"{% if role == 'admin' %} selected{% endif %}>Admin - Full access to all features</option>
                    <option value="senior_investigator"{% if role == 'senior_investigator' %} selected{% endif %}>Senior Investigator - Can manage cases and financials</option>
                    <option value="investigator"{% if role == 'investigator' %} selected{% endif %}>Investigator - Can view and update assigned cases</option>
                    <option value="junior_investigator"{% if role == 'junior_investigator' %} selected{% endif %}>Junior Investigator - Can create cases and findings</option>
                    <option value="viewer"{% if role == 'viewer' %} selected{% endif %}>Viewer - Read-only access</option>
                </select>
            </div>

            {% if current_user.is_super_admin %}
            <div class="form-group">
                <label for="tenant_id">Tenant</label>
                <select id="tenant_id" name="tenant_id">
                    <option value="">-- Select tenant (optional) --</option>
                    {% for t in tenants %}
                    <option value="{{ t.id }}"{% if t.id == current_user.tenant_id %} selected{% endif %}>{{ t.name }}</option>
                    {% endfor %}
                </select>
                <small style="color:var(--text-muted);">Defaults to your tenant if left blank.</small>
            </div>
            {% endif %}

            <input type="hidden" name="generated_password" value="{{ generated_password }}">
            
            <div class="btn-group" style="margin:1.5rem 0 0;">
                <button type="submit" class="btn-cms primary">Create User</button>
                <a href="{{ url_for('users.list_users') }}" class="btn-cms">Cancel</a>
            </div>
        </form>
    </div>

    <script nonce="{{ csp_nonce }}">
        function togglePw() {
            const pw = document.getElementById('password');
            pw.type = pw.type === 'password' ? 'text' : 'password';
        }

        async function generatePw() {
            try {
                const resp = await fetch('{{ url_for("users.generate_password_api") }}');
                const data = await resp.json();
                document.getElementById('password').value = data.password;
                document.querySelector('input[name="generated_password"]').value = data.password;
            } catch (e) {
                alert('Failed to generate password');
            }
        }

        document.getElementById('createUserForm').addEventListener('submit', function(e) {
            const emailCb = document.getElementById('sendEmail');
            const smsCb = document.getElementById('sendSMS');
            if (!emailCb.checked && !smsCb.checked) {
                const pwField = document.getElementById('password');
                pwField.type = 'text';
            }
        });
    </script>
{% endblock %}
