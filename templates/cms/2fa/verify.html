<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Factor Authentication</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        h1 { color: #1a1a2e; margin-bottom: 0.25rem; text-align: center; }
        .subtitle { color: #666; margin-bottom: 1.5rem; text-align: center; font-size: 0.9rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #555; font-weight: 500; }
        input { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; text-align: center; letter-spacing: 8px; }
        input:focus { outline: none; border-color: #16213e; }
        .btn { width: 100%; padding: 0.75rem; background: #16213e; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: 500; }
        .btn:hover { background: #1a1a2e; }
        .btn-link { background: none; border: none; color: #2563eb; cursor: pointer; font-size: 0.85rem; text-decoration: underline; padding: 0; }
        .btn-link:hover { color: #1d4ed8; }
        .alert { padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; }
        .alert-danger { background: #fee2e2; color: #dc2626; }
        .recovery-section { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #eee; }
        .recovery-section details { color: #666; }
        .recovery-section summary { cursor: pointer; font-size: 0.85rem; color: #2563eb; }
        .recovery-section summary:hover { color: #1d4ed8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Two-Factor Authentication</h1>
        <p class="subtitle">Enter the code from your authenticator app.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label for="code">Authentication code</label>
                <input type="text" name="code" id="code" placeholder="000000" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus>
            </div>
            <button type="submit" class="btn">Verify</button>
        </form>

        <div class="recovery-section">
            <details>
                <summary>Use a recovery code instead</summary>
                <form method="POST" style="margin-top: 0.75rem;">
                    <div class="form-group">
                        <label for="recovery_code">Recovery code</label>
                        <input type="text" name="recovery_code" id="recovery_code" placeholder="XXXX-XXXX-XXXX" style="letter-spacing:normal;text-align:left;" autocomplete="off">
                    </div>
                    <button type="submit" class="btn-link" style="width:auto;padding:0.5rem 1rem;background:#6c757d;color:white;border-radius:6px;text-decoration:none;display:inline-block;">Use recovery code</button>
                </form>
            </details>
        </div>
    </div>
</body>
</html>
