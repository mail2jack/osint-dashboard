<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iveras OSINT</title>
    <link rel="stylesheet" href="/static/style.css">
    {% if g.use_bundle %}
    <link rel="stylesheet" href="/static/dist/bundle.min.css?v={{ g.css_version }}">
    {% endif %}
    <script>
    function esc(str) {
        if (!str) return '';
        var d = document.createElement('div');
        d.appendChild(document.createTextNode(String(str)));
        return d.innerHTML;
    }
    </script>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 16v-4M12 8h.01"></path>
                </svg>
                <h1>Iveras <span>OSINT</span></h1>
            </div>
            <div class="header-actions">
                <div id="systemStatus" class="system-status idle">
                    <span class="status-dot"></span>
                    <span class="status-text">Idle</span>
                </div>
                <button class="btn-icon" data-click="toggleHistory" title="History">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    History
                </button>
                <button class="btn-icon" data-click="toggleHealthModal" title="Health">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                </button>
                <button class="btn-icon" data-click="restartApp" title="Restart">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                </button>
                <button class="btn-icon" data-click="openChangelog" title="Changelog">v<span id="versionBadge">2.0</span></button>
            </div>
        </header>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-group">
                <button class="toolbar-btn active" data-tool="person">People</button>
                <button class="toolbar-btn" data-tool="social">Social <span id="rapidUsageBadge" style="font-size:0.65rem;opacity:0.6;display:none;"></span></button>
                <button class="toolbar-btn" data-tool="email">Email</button>
                <button class="toolbar-btn" data-tool="phone">Phone</button>
                <button class="toolbar-btn" data-tool="webcam">Webcams</button>
            </div>
            <div class="toolbar-group">
                <button class="toolbar-btn" data-tool="maigret">Maigret</button>
                <button class="toolbar-btn" data-tool="username">Sherlock</button>
                <button class="toolbar-btn" data-tool="holehe">Holehe</button>
            </div>
            <div class="toolbar-group">
                <button class="toolbar-btn" data-tool="ip">IP</button>
                <button class="toolbar-btn" data-tool="domain">Domain</button>
                <button class="toolbar-btn" data-tool="openkvk">OpenKVK</button>
            </div>
        </div>

        <!-- Search -->
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Enter search query...">
            <button id="searchBtn" class="search-btn">Search</button>
        </div>

        <!-- Options -->
        <div class="options" id="optionsBar" style="display:none">
            <label>Platforms:</label>
            <select id="siteCategory">
                <option value="social">Social Media (~45 sites)</option>
                <option value="all">All Sites (~3000 sites)</option>
            </select>
            <span class="options-count" id="siteCount">45 sites</span>
        </div>

        <!-- Results -->
        <div id="results" class="results hidden">
            <div class="results-header">
                <h3>Results</h3>
                <button class="close-btn" data-click="closeResults">&times;</button>
            </div>
            <div id="resultsContent" class="results-content"></div>
        </div>

        <!-- Loading -->
        <div id="loading" class="hidden">
            <div class="loading">
                <div class="spinner"></div>
                <p>Searching...</p>
                <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
                <p class="progress-text" id="progressText">Preparing...</p>
                <div class="search-controls">
                    <button class="btn-icon danger" data-click="stopSearch">■ Stop</button>
                </div>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div class="modal-overlay" id="historyModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Search History</h3>
                <button class="close-btn" data-click="toggleHistory">&times;</button>
            </div>
            <div class="modal-body" id="historyContent">
                <div class="empty">No history yet</div>
            </div>
        </div>
    </div>

    <!-- Health Modal -->
    <div class="modal-overlay" id="healthModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Platform Status</h3>
                <button class="close-btn" data-click="toggleHealthModal">&times;</button>
            </div>
            <div class="modal-body" id="healthContent">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <!-- Changelog Modal -->
    <div class="modal-overlay" id="changelogModal">
        <div class="modal">
            <div class="modal-header">
                <h3>What's New</h3>
                <button class="close-btn" data-click="openChangelog">&times;</button>
            </div>
            <div class="modal-body" id="changelogContent">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        // State
        let currentTool = 'person';
        let eventSource = null;
        let searchStartTime = null;

        // DOM Elements
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsDiv = document.getElementById('results');
        const resultsContent = document.getElementById('resultsContent');
        const loadingDiv = document.getElementById('loading');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const toolbarBtns = document.querySelectorAll('.toolbar-btn');
        const systemStatus = document.getElementById('systemStatus');

        function updateSystemStatus(searching) {
            if (searching) {
                systemStatus.classList.remove('idle');
                systemStatus.classList.add('searching');
                systemStatus.querySelector('.status-text').textContent = 'Searching';
            } else {
                systemStatus.classList.remove('searching');
                systemStatus.classList.add('idle');
                systemStatus.querySelector('.status-text').textContent = 'Idle';
            }
        }
        
        // Placeholders
        const placeholders = {
            social: 'Enter username or email...',
            person: 'Enter full name (e.g., John Smith)',
            email: 'Enter email address...',
            phone: 'Enter phone number (+31612345678)',
            webcam: 'Enter country or city (e.g., Netherlands, Amsterdam)',
            whatsapp: 'Enter phone number...',

            maigret: 'Enter username (deep search)...',
            username: 'Enter username...',
            holehe: 'Enter email for deep search...',
            ip: 'Enter IP address...',
            domain: 'Enter domain name...',
            openkvk: 'Company name, KVK number, or postcode...'
        };
        
        // Handle URL parameters for pre-filling search (after DOM is ready)
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const prefillQuery = urlParams.get('q');
            const prefillTool = urlParams.get('tool');
            
            if (prefillQuery && searchInput) {
                searchInput.value = prefillQuery;
            }
            if (prefillTool && ['social', 'person', 'email', 'phone', 'domain', 'maigret', 'sherlock'].includes(prefillTool)) {
                switchTool(prefillTool);
            }
            
            // Auto-search if query is pre-filled
            if (prefillQuery && prefillTool === 'person') {
                setTimeout(() => performSearch(), 500);
            }
            
            // Fetch RapidAPI usage status
            fetch('/api/username/rapidapi-status').then(r => r.json()).then(status => {
                const badge = document.getElementById('rapidUsageBadge');
                if (status.configured) {
                    badge.style.display = 'inline';
                    const pct = Math.round((status.used / status.limit) * 100);
                    const color = pct >= 80 ? '#f44336' : pct >= 50 ? '#f59e0b' : '#4caf50';
                    badge.textContent = ` ${status.used}/${status.limit}`;
                    badge.style.color = color;
                }
            }).catch(() => {});
        });
        
        // Tool selection
        const optionsBar = document.getElementById('optionsBar');
        
        toolbarBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                toolbarBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTool = btn.dataset.tool;
                searchInput.placeholder = placeholders[currentTool];
                searchInput.value = '';
                closeResults();
                
                // Show/hide options based on tool
                const siteCategory = document.getElementById('siteCategory');
                
                if (currentTool === 'maigret') {
                    optionsBar.style.display = 'flex';
                    siteCategory.style.display = 'block';
                    // Reset to social media default
                    siteCategory.value = 'social';
                    document.getElementById('siteCount').textContent = '45 sites';
                } else {
                    optionsBar.style.display = 'none';
                }
                
                // Show/hide progress bar based on tool
                const progressBar = document.querySelector('.progress-bar');
                const progressTextEl = document.querySelector('.progress-text');
                if (currentTool === 'person') {
                    progressBar.style.display = 'none';
                    progressTextEl.style.display = 'none';
                } else {
                    progressBar.style.display = '';
                    progressTextEl.style.display = '';
                }
            });
        });
        
        // Update site count on change
        document.getElementById('siteCategory').addEventListener('change', function() {
            const counts = { all: 3000, social: 45 };
            document.getElementById('siteCount').textContent = (counts[this.value] || 45) + ' sites';
        });

        // Search
        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') performSearch();
        });

        function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;
            
            searchStartTime = Date.now();
            closeResults();
            loadingDiv.classList.remove('hidden');
            searchBtn.disabled = true;
            searchBtn.textContent = 'Searching...';
            updateSystemStatus(true);
            
            // Route to appropriate search
            if (currentTool === 'social') {
                searchSocial(query);
            } else if (currentTool === 'email') {
                searchEmail(query);
            } else if (currentTool === 'phone') {
                searchPhone(query);
            } else if (currentTool === 'person') {
                searchPerson(query);
            } else if (currentTool === 'maigret') {
                searchMaigret(query);
            } else if (currentTool === 'username') {
                searchSherlock(query);
            } else if (currentTool === 'holehe') {
                searchHolehe(query);
            } else if (currentTool === 'ip') {
                searchIP(query);
            } else if (currentTool === 'domain') {
                searchDomain(query);
            } else if (currentTool === 'webcam') {
                searchWebcams(query);
            } else if (currentTool === 'openkvk') {
                searchOpenKVK(query);
            }
        }

        // API Calls
        async function searchSocial(query) {
            try {
                const res = await fetch('/api/username/rapidapi', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: query })
                });
                const data = await res.json();
                
                if (data.fallback_to_sherlock) {
                    // API limit reached — fall back to Sherlock streaming
                    const usageNote = data.api_usage ? ` (${data.api_usage.used}/${data.api_usage.limit} gebruikt deze maand)` : '';
                    showError('RapidAPI maandlimiet bereikt' + usageNote + '. Schakel over naar Sherlock...');
                    setTimeout(() => searchSherlock(query), 500);
                } else {
                    showUsernameResults(data);
                }
            } catch (e) {
                showError('Social search failed: ' + e.message);
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = 'Search';
                updateSystemStatus(false);
            }
        }
        
        async function searchMaigret(query) {
            startStreaming('/api/username/maigret', { username: query, limit: 300 });
        }
        
        async function searchSherlock(query) {
            startStreaming('/api/username/stream', { username: query });
        }

        async function searchEmail(query) {
            const checkboxes = document.querySelectorAll('#socialCategories input[type="checkbox"]:checked');
            const tags = Array.from(checkboxes).map(cb => cb.value);
            startStreaming('/api/email/stream', { email: query, tags: tags });
        }

        async function searchPhone(query) {
            try {
                const res = await fetch('/api/phone', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: query })
                });
                const data = await res.json();
                showPhoneResults(data);
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = 'Search';
                updateSystemStatus(false);
            }
        }

        async function searchPerson(query) {
            const urlParams = new URLSearchParams(window.location.search);
            const caseId = urlParams.get('case_id');
            const subjectId = urlParams.get('subject_id');
            
            const body = { name: query };
            if (caseId) body.case_id = caseId;
            if (subjectId) body.subject_id = subjectId;
            
            startStreaming('/api/person/stream', body);
        }

        async function searchMaigret(query) {
            const siteCategory = document.getElementById('siteCategory').value;
            if (siteCategory === 'all') {
                startStreaming('/api/username/maigret', { username: query, tags: [], limit: 3000 });
            } else {
                startStreaming('/api/username/maigret', { username: query, tags: ['social'], limit: 45 });
            }
        }

        async function searchSherlock(query) {
            startStreaming('/api/username/stream', { username: query });
        }

        async function searchHolehe(query) {
            startStreaming('/api/email/holehe', { email: query });
        }

        async function searchIP(query) {
            try {
                const res = await fetch('/api/ip', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip: query })
                });
                const data = await res.json();
                showIPResults(data);
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = 'Search';
                updateSystemStatus(false);
            }
        }

        async function searchDomain(query) {
            try {
                const res = await fetch('/api/domain', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ domain: query })
                });
                const data = await res.json();
                showDomainResults(data);
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = 'Search';
                updateSystemStatus(false);
            }
        }

        async function searchOpenKVK(query) {
            try {
                const res = await fetch('/api/openkvk', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });
                const data = await res.json();
                showOpenKVKResults(data);
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = 'Search';
                updateSystemStatus(false);
            }
        }

        function showOpenKVKResults(data) {
            loadingDiv.classList.add('hidden');
            resultsDiv.classList.remove('hidden');
            
            if (data.error) {
                let errorHtml = `<div class="card"><h3>OpenKVK Setup Required</h3><p>${data.error}</p>`;
                if (data.setup_hint) {
                    errorHtml += `<p style="margin-top:10px">${data.setup_hint}</p>`;
                    errorHtml += `<a href="https://overheid.io" target="_blank" class="btn" style="margin-top:10px">Get API Key ↗</a>`;
                }
                errorHtml += `</div>`;
                resultsContent.innerHTML = errorHtml;
                return;
            }
            
            const results = data.results || [];
            if (results.length === 0) {
                resultsContent.innerHTML = `<div class="empty">No results found for "${data.query}"</div>`;
                return;
            }
            
            const renderCompany = (company) => {
                const status = company.actief !== false ? '<span style="color:#4caf50">● Active</span>' : '<span style="color:#f44336">● Inactive</span>';
                const coords = company.coords ? `<a href="https://www.google.com/maps?q=${company.coords.lat},${company.coords.lon}" target="_blank" class="btn" style="padding:5px 10px;font-size:12px">📍 Map</a>` : '';
                
                return `
                    <div class="card" style="margin-bottom:15px">
                        <h3>${company.naam || 'N/A'} ${status}</h3>
                        <div class="grid-2">
                            ${company.kvknummer ? `<div class="grid-item"><div class="label">KVK Number</div><div class="value">${company.kvknummer}</div></div>` : ''}
                            ${company.rechtsvorm ? `<div class="grid-item"><div class="label">Legal Form</div><div class="value">${company.rechtsvorm}</div></div>` : ''}
                            ${company.inschrijvingstype ? `<div class="grid-item"><div class="label">Type</div><div class="value">${company.inschrijvingstype}</div></div>` : ''}
                            ${company.vestigingsnummer ? `<div class="grid-item"><div class="label">Establishment</div><div class="value">${company.vestigingsnummer}</div></div>` : ''}
                            ${company.bezoekadres ? `<div class="grid-item"><div class="label">Address</div><div class="value">${company.bezoekadres}</div></div>` : ''}
                            ${company.postcode ? `<div class="grid-item"><div class="label">Postcode</div><div class="value">${company.postcode}</div></div>` : ''}
                            ${company.plaats ? `<div class="grid-item"><div class="label">City</div><div class="value">${company.plaats}</div></div>` : ''}
                            ${company.website ? `<div class="grid-item"><div class="label">Website</div><div class="value"><a href="https://${company.website}" target="_blank">${company.website}</a></div></div>` : ''}
                        </div>
                        ${company.activiteit ? `<p style="margin:10px 0"><strong>Activity:</strong> ${company.activiteit}</p>` : ''}
                        ${company.sbi_codes && company.sbi_codes.length ? `<p style="margin:5px 0;font-size:12px"><strong>SBI Codes:</strong> ${company.sbi_codes.join(', ')}</p>` : ''}
                        ${company.handelsnamen && company.handelsnamen.length > 1 ? `<p style="margin:5px 0;font-size:12px"><strong>Also known as:</strong> ${company.handelsnamen.slice(1).join(', ')}</p>` : ''}
                        <div style="margin-top:10px">${coords}</div>
                    </div>
                `;
            };
            
            resultsContent.innerHTML = `
                <div class="stats">
                    <div class="stat"><div class="stat-value">${data.total || results.length}</div><div class="stat-label">Total Found</div></div>
                    <div class="stat"><div class="stat-value">${results.length}</div><div class="stat-label">Showing</div></div>
                </div>
                ${results.map(renderCompany).join('')}
            `;
        }

        // Streaming
        let searchCancelled = false;
        async function startStreaming(endpoint, body) {
            if (eventSource) eventSource.close();
            searchCancelled = false;
            
            const searchStartTime = Date.now();
            let lastUpdateTime = searchStartTime;
            let lastChecked = 0;
            
            searchBtn.disabled = true;
            searchBtn.textContent = 'Searching...';
            updateSystemStatus(true);
            
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    showError(errorData.error + (errorData.hint ? '\n\n' + errorData.hint : ''));
                    searchBtn.disabled = false;
                    searchBtn.textContent = 'Search';
                    updateSystemStatus(false);
                    return;
                }
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let finished = false;
                
                while (true) {
                    if (searchCancelled) {
                        finished = true;
                        break;
                    }
                    
                    const { done, value } = await reader.read();
                    if (done || finished) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (searchCancelled) {
                            finished = true;
                            break;
                        }
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.progress) {
                                    const p = data.progress;
                                    const checked = p.checked !== undefined ? p.checked : (p.completed || 0);
                                    const total = p.total || 1;
                                    const percent = p.percent !== undefined ? p.percent : Math.round((checked / total) * 100);
                                    progressFill.style.width = percent + '%';
                                    
                                    // Calculate time estimate
                                    const now = Date.now();
                                    const elapsedSecs = (now - searchStartTime) / 1000;
                                    let timeEstimate = '';
                                    if (checked > lastChecked) {
                                        const rate = checked / elapsedSecs; // sites per second
                                        const remaining = total - checked;
                                        const secsRemaining = remaining / rate;
                                        if (secsRemaining > 60) {
                                            timeEstimate = ` (~${Math.round(secsRemaining/60)}m remaining)`;
                                        } else if (secsRemaining > 0) {
                                            timeEstimate = ` (~${Math.round(secsRemaining)}s remaining)`;
                                        }
                                    }
                                    lastChecked = checked;
                                    lastUpdateTime = now;
                                    
                                    progressText.textContent = `${checked}/${total}${p.current_site ? ' - ' + p.current_site : ''}${timeEstimate}`;
                                }
                                if (data.complete) {
                                    showResults(data.result);
                                    finished = true;
                                }
                                if (data.error) {
                                    showError(data.error);
                                    finished = true;
                                }
                            } catch (e) {
                                console.error('Parse error:', e);
                            }
                        }
                    }
                }
                
                if (!finished) {
                    loadingDiv.classList.add('hidden');
                }
            } catch (e) {
                showError(e.message);
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = 'Search';
                updateSystemStatus(false);
            }
        }
        
        // Add found dorks to CMS case findings
        async function addDorksToFindings(caseId, subjectId, dorks, name) {
            if (!caseId || dorks.length === 0) return;
            
            let added = 0;
            let errors = 0;
            
            for (const dork of dorks) {
                try {
                    const response = await fetch('/api/cms/add-finding', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            case_id: caseId,
                            subject_id: subjectId || null,
                            title: `OSINT: ${dork.domain} - ${name}`,
                            content: `Found ${dork.category} profile for ${name}.\n\nSource: DuckDuckGo Search\nQuery: ${dork.query || 'N/A'}`,
                            source_url: dork.url,
                            source_type: 'osint',
                            finding_type: dork.category === 'social_media' ? 'social' : 'identity',
                            reliability_score: dork.category === 'social_media' ? 8 : 6
                        })
                    });
                    
                    if (response.ok) {
                        added++;
                    } else {
                        errors++;
                    }
                } catch (e) {
                    errors++;
                }
            }
            
            alert(`Added ${added} findings to case${errors > 0 ? ` (${errors} errors)` : ''}`);
            
            // Open the case in CMS
            window.open(`/cms/cases/${caseId}`, '_blank');
        }
        
        // Utility functions
        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = '✓';
                setTimeout(() => { btn.textContent = '⎘'; }, 1500);
            }).catch(() => {
                btn.textContent = '✕';
                setTimeout(() => { btn.textContent = '⎘'; }, 1500);
            });
        }

        // Display functions
        function showResults(data) {
            loadingDiv.classList.add('hidden');
            resultsDiv.classList.remove('hidden');
            
            // Check if it's person search data
            if (data.search_links || data.dorks_results) {
                showPersonResults(data);
                return;
            }
            
            // Calculate elapsed time
            const elapsed = searchStartTime ? Math.round((Date.now() - searchStartTime) / 1000) : 0;
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            const elapsedStr = minutes > 0 ? `${minutes}m ${seconds}s` : `${seconds}s`;
            
            const found = data.platforms || data.found || data.findings || [];
            
            // Get found count - handle different data structures

                        <div class="grid-2">
                            ${whois['registrant'] ? `<div class="grid-item"><div class="label">Name</div><div class="value">${whois['registrant']}</div></div>` : ''}
                            ${whois.registrant_org ? `<div class="grid-item"><div class="label">Organization</div><div class="value">${whois.registrant_org}</div></div>` : ''}
                            ${whois.registrant_country ? `<div class="grid-item"><div class="label">Country</div><div class="value">${whois.registrant_country}</div></div>` : ''}
                        </div>
                    </div>
                `;
            }
            
            resultsContent.innerHTML = `
                <div class="card">
                    <h3>Domain: ${data.domain}</h3>
                    <div class="grid-2">
                        <div class="grid-item"><div class="label">Registrar</div><div class="value">${whois.registrar || 'N/A'}</div></div>
                        <div class="grid-item"><div class="label">Created</div><div class="value">${whois.registration_date || 'N/A'}</div></div>
                        <div class="grid-item"><div class="label">Expires</div><div class="value">${whois.expiration_date || 'N/A'}</div></div>
                        <div class="grid-item"><div class="label">Updated</div><div class="value">${whois.updated_date || 'N/A'}</div></div>
                        ${whois.status ? `<div class="grid-item"><div class="label">Status</div><div class="value" style="font-size:11px">${whois.status}</div></div>` : ''}
                        ${whois.dnssec ? `<div class="grid-item"><div class="label">DNSSEC</div><div class="value">${whois.dnssec}</div></div>` : ''}
                    </div>
                </div>
                ${whois.name_servers && whois.name_servers.length ? `
                    <div class="card">
                        <h3>Name Servers</h3>
                        <div class="tags">${whois.name_servers.map(ns => `<span class="tag">${ns}</span>`).join('')}</div>
                    </div>
                ` : ''}
                ${registrantSection}
                ${dnsSection}
                ${sslSection}
                ${data.subdomains && data.subdomains.length ? `
                    <div class="card">
                        <h3>Subdomains (${data.subdomains.length})</h3>
                        <div class="tags">${data.subdomains.map(s => `<span class="tag">${s}</span>`).join('')}</div>
                    </div>
                ` : ''}
                ${data.ip_addresses && data.ip_addresses.length ? `
                    <div class="card">
                        <h3>IP Addresses</h3>
                        <div class="tags">${data.ip_addresses.map(ip => `<span class="tag">${ip}</span>`).join('')}</div>
                    </div>
                ` : ''}
            `;
        }

        async function searchWebcams(query) {
            loadingDiv.classList.remove('hidden');
            searchBtn.disabled = true;
            searchBtn.textContent = 'Searching...';
            updateSystemStatus(true);
            document.querySelector('.progress-bar').style.display = 'none';
            document.querySelector('.progress-text').style.display = 'none';
            
            try {
                const res = await fetch('/api/webcam', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });
                const data = await res.json();
                showWebcamResults(data);
            } catch (e) {
                showError(e.message);
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = 'Search';
                updateSystemStatus(false);
            }
        }

        function showWebcamResults(data) {
            loadingDiv.classList.add('hidden');
            resultsDiv.classList.remove('hidden');
            
            if (data.error) {
                resultsContent.innerHTML = `<div class="empty">${data.error}</div>`;
                return;
            }
            
            const webcams = data.webcams || [];
            const countries = data.countries || [];
            
            resultsContent.innerHTML = `
                <div class="stats">
                    <div class="stat"><div class="stat-value">${webcams.length}</div><div class="stat-label">Cameras</div></div>
                    <div class="stat"><div class="stat-value">${countries.length}</div><div class="stat-label">Countries</div></div>
                </div>
                ${countries.length ? `
                    <div class="card">
                        <h3>Countries</h3>
                        <div class="tags">
                            ${countries.map(c => `<span class="tag" data-click="searchWebcamsByCountry" data-code="${c.code}">${c.name}</span>`).join('')}
                        </div>
                    </div>
                ` : ''}
                ${webcams.length ? `
                    <div class="webcam-grid">
                        ${webcams.map(w => `
                            <div class="webcam-item">
                                <img src="${w.thumbnail}" alt="${w.title}" loading="lazy" data-fallback-src="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23333%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%2212%22>Offline</text></svg>">
                                <div class="webcam-info">
                                    <div class="webcam-title">${w.title}</div>
                                    <div class="webcam-location">${w.location}</div>
                                    <a href="${w.url}" target="_blank" class="webcam-link">Open ↗</a>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                ` : '<div class="empty">No webcams found</div>'}
            `;
        }

        async function searchWebcamsByCountry(code) {
            loadingDiv.classList.remove('hidden');
            try {
                const res = await fetch('/api/webcam', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ country: code })
                });
                const data = await res.json();
                showWebcamResults(data);
            } catch (e) {
                showError(e.message);
            }
        }

        function showError(msg) {
            loadingDiv.classList.add('hidden');
            resultsDiv.classList.remove('hidden');
            resultsContent.innerHTML = `<div class="empty" style="color:var(--red)">Error: ${msg}</div>`;
        }

        function closeResults() {
            stopSearch();
            resultsDiv.classList.add('hidden');
            // Restore progress bar for next search
            document.querySelector('.progress-bar').style.display = '';
            document.querySelector('.progress-text').style.display = '';
            // Re-enable search button in case search was cancelled mid-flight
            searchBtn.disabled = false;
            searchBtn.textContent = 'Search';
            updateSystemStatus(false);
        }

        function stopSearch() {
            searchCancelled = true;
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            loadingDiv.classList.add('hidden');
            searchBtn.disabled = false;
            searchBtn.textContent = 'Search';
            updateSystemStatus(false);
            progressFill.style.width = '0%';
            progressText.textContent = '';
        }

        // Modals
        function toggleHistory() {
            const modal = document.getElementById('historyModal');
            modal.classList.toggle('active');
            if (modal.classList.contains('active')) loadHistory();
        }

        function toggleHealthModal() {
            const modal = document.getElementById('healthModal');
            modal.classList.toggle('active');
        }

        function openChangelog() {
            const modal = document.getElementById('changelogModal');
            const content = document.getElementById('changelogContent');
            modal.classList.toggle('active');
            
            if (modal.classList.contains('active')) {
                content.innerHTML = '<div class="loading">Loading...</div>';
                fetch('/api/changelog')
                    .then(r => r.json())
                    .then(data => {
                        content.innerHTML = data.html || '<div class="empty">No changelog available</div>';
                    })
                    .catch(() => {
                        content.innerHTML = '<div class="empty">Failed to load changelog</div>';
                    });
            }
        }

        function restartApp() {
            if (confirm('Restart the application?')) {
                fetch('/api/system/restart', { method: 'POST' })
                    .then(() => setTimeout(() => window.location.reload(), 2000));
            }
        }

        function loadHistory() {
            fetch('/api/history')
                .then(r => r.json())
                .then(data => {
                    const list = data.history || [];
                    document.getElementById('historyContent').innerHTML = list.length ? 
                        list.map(h => `
                            <div class="history-item">
                                <div class="history-info">
                                    <div class="history-query">${h.query}</div>
                                    <div class="history-meta">${h.tool} • ${new Date(h.timestamp).toLocaleDateString()}</div>
                                </div>
                            </div>
                        `).join('') : '<div class="empty">No history</div>';
                });
        }

        // Init
        let appConfig = {};
        fetch('/api/version').then(r => r.json()).then(data => {
            document.getElementById('versionBadge').textContent = data.version;
        });
        fetch('/api/config').then(r => r.json()).then(data => {
            appConfig = data;
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                searchInput.focus();
            }
        });

        document.addEventListener('click', function(e) {
            var el = e.target.closest('[data-click]');
            if (!el) return;
            var action = el.getAttribute('data-click');
            if (action === 'copyToClipboard') {
                e.preventDefault();
                copyToClipboard(el.getAttribute('data-url'), el);
            } else if (action === 'addDorksToFindings') {
                e.preventDefault();
                var caseId = JSON.parse(el.getAttribute('data-case-id'));
                var subjectId = JSON.parse(el.getAttribute('data-subject-id'));
                var dorks = JSON.parse(el.getAttribute('data-dorks'));
                var name = JSON.parse(el.getAttribute('data-name'));
                addDorksToFindings(caseId, subjectId, dorks, name);
            } else if (action === 'searchWebcamsByCountry') {
                e.preventDefault();
                searchWebcamsByCountry(el.getAttribute('data-code'));
            }
        });
    </script>
</body>
</html>
