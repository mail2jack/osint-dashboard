<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 16v-4M12 8h.01"></path>
                </svg>
                <h1>OSINT <span>Dashboard</span></h1>
            </div>
            <div class="header-actions">
                <div id="systemStatus" class="system-status idle">
                    <span class="status-dot"></span>
                    <span class="status-text">Idle</span>
                </div>
                <button class="btn-icon" onclick="toggleHistory()" title="History">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    History
                </button>
                <button class="btn-icon" onclick="toggleHealthModal()" title="Health">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                </button>
                <button class="btn-icon" onclick="restartApp()" title="Restart">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                </button>
                <button class="btn-icon" onclick="openChangelog()" title="Changelog">v<span id="versionBadge">2.0</span></button>
            </div>
        </header>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-group">
                <button class="toolbar-btn active" data-tool="person">People</button>
                <button class="toolbar-btn" data-tool="social">Social</button>
                <button class="toolbar-btn" data-tool="email">Email</button>
                <button class="toolbar-btn" data-tool="phone">Phone</button>
            </div>
            <div class="toolbar-group">
                <button class="toolbar-btn" data-tool="maigret">Maigret</button>
                <button class="toolbar-btn" data-tool="username">Sherlock</button>
                <button class="toolbar-btn" data-tool="holehe">Holehe</button>
            </div>
            <div class="toolbar-group">
                <button class="toolbar-btn" data-tool="ip">IP</button>
                <button class="toolbar-btn" data-tool="domain">Domain</button>
            </div>
        </div>

        <!-- Search -->
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Enter search query...">
            <button id="searchBtn" class="search-btn">Search</button>
        </div>

        <!-- Options -->
        <div class="options" id="optionsBar" style="display:none">
            <label>Platforms:</label>
            <select id="siteCategory">
                <option value="all">All Sites</option>
                <option value="social">Social Media</option>
                <option value="developer">Developer</option>
                <option value="gaming">Gaming</option>
            </select>
            <div id="socialCategories" class="checkbox-group" style="display:none">
                <label><input type="checkbox" value="30" checked> Quick (~30)</label>
                <label><input type="checkbox" value="50"> Standard (~50)</label>
                <label><input type="checkbox" value="100"> Deep (~100)</label>
                <label><input type="checkbox" value="200"> Full (~200)</label>
            </div>
            <span class="options-count" id="siteCount">30 sites</span>
        </div>

        <!-- Results -->
        <div id="results" class="results hidden">
            <div class="results-header">
                <h3>Results</h3>
                <button class="close-btn" onclick="closeResults()">&times;</button>
            </div>
            <div id="resultsContent" class="results-content"></div>
        </div>

        <!-- Loading -->
        <div id="loading" class="hidden">
            <div class="loading">
                <div class="spinner"></div>
                <p>Searching...</p>
                <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
                <p class="progress-text" id="progressText">Preparing...</p>
                <div class="search-controls">
                    <button class="btn-icon danger" onclick="stopSearch()">■ Stop</button>
                </div>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div class="modal-overlay" id="historyModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Search History</h3>
                <button class="close-btn" onclick="toggleHistory()">&times;</button>
            </div>
            <div class="modal-body" id="historyContent">
                <div class="empty">No history yet</div>
            </div>
        </div>
    </div>

    <!-- Health Modal -->
    <div class="modal-overlay" id="healthModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Platform Status</h3>
                <button class="close-btn" onclick="toggleHealthModal()">&times;</button>
            </div>
            <div class="modal-body" id="healthContent">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <!-- Changelog Modal -->
    <div class="modal-overlay" id="changelogModal">
        <div class="modal">
            <div class="modal-header">
                <h3>What's New</h3>
                <button class="close-btn" onclick="openChangelog()">&times;</button>
            </div>
            <div class="modal-body" id="changelogContent">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        // State
        let currentTool = 'person';
        let eventSource = null;
        let searchStartTime = null;

        // DOM Elements
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsDiv = document.getElementById('results');
        const resultsContent = document.getElementById('resultsContent');
        const loadingDiv = document.getElementById('loading');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const toolbarBtns = document.querySelectorAll('.toolbar-btn');
        const systemStatus = document.getElementById('systemStatus');

        function updateSystemStatus(searching) {
            if (searching) {
                systemStatus.classList.remove('idle');
                systemStatus.classList.add('searching');
                systemStatus.querySelector('.status-text').textContent = 'Searching';
            } else {
                systemStatus.classList.remove('searching');
                systemStatus.classList.add('idle');
                systemStatus.querySelector('.status-text').textContent = 'Idle';
            }
        }

        // Placeholders
        const placeholders = {
            social: 'Enter username or email...',
            person: 'Enter full name (e.g., John Smith)',
            email: 'Enter email address...',
            phone: 'Enter phone number (+31612345678)',
            whatsapp: 'Enter phone number...',

            maigret: 'Enter username (deep search)...',
            username: 'Enter username...',
            holehe: 'Enter email for deep search...',
            ip: 'Enter IP address...',
            domain: 'Enter domain name...'
        };

        // Tool selection
        const optionsBar = document.getElementById('optionsBar');
        
        toolbarBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                toolbarBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTool = btn.dataset.tool;
                searchInput.placeholder = placeholders[currentTool];
                searchInput.value = '';
                closeResults();
                
                // Show/hide options based on tool
                const siteCategory = document.getElementById('siteCategory');
                const socialCategories = document.getElementById('socialCategories');
                
                if (currentTool === 'social' || currentTool === 'email') {
                    optionsBar.style.display = 'flex';
                    siteCategory.style.display = 'none';
                    socialCategories.style.display = 'block';
                } else if (currentTool === 'maigret' || currentTool === 'username') {
                    optionsBar.style.display = 'flex';
                    siteCategory.style.display = 'none';
                    socialCategories.style.display = 'block';
                } else {
                    optionsBar.style.display = 'none';
                }
                
                // Show/hide progress bar based on tool
                const progressBar = document.querySelector('.progress-bar');
                const progressTextEl = document.querySelector('.progress-text');
                if (currentTool === 'person') {
                    progressBar.style.display = 'none';
                    progressTextEl.style.display = 'none';
                } else {
                    progressBar.style.display = '';
                    progressTextEl.style.display = '';
                }
            });
        });
        
        // Update site count on change
        document.getElementById('siteCategory').addEventListener('change', function() {
            const counts = { all: 56, social: 17, developer: 9, gaming: 4 };
            document.getElementById('siteCount').textContent = (counts[this.value] || 56) + ' sites';
        });
        
        // Social/Email categories checkboxes
        document.querySelectorAll('#socialCategories input[type="checkbox"]').forEach(cb => {
            cb.addEventListener('change', function() {
                const checked = document.querySelectorAll('#socialCategories input[type="checkbox"]:checked').length;
                // Check if numeric values (Email tool) or string values (Social tool)
                const firstCb = document.querySelector('#socialCategories input[type="checkbox"]');
                if (firstCb && !isNaN(firstCb.value)) {
                    // Email tool - use highest value selected
                    const values = Array.from(document.querySelectorAll('#socialCategories input[type="checkbox"]:checked')).map(c => parseInt(c.value));
                    const maxVal = values.length > 0 ? Math.max(...values) : 30;
                    document.getElementById('siteCount').textContent = maxVal + ' sites';
                } else {
                    // Social tool - sum values
                    const catCounts = { social: 17, developer: 9, gaming: 4 };
                    let total = 0;
                    document.querySelectorAll('#socialCategories input[type="checkbox"]:checked').forEach(c => {
                        total += catCounts[c.value] || 0;
                    });
                    document.getElementById('siteCount').textContent = total + ' sites';
                }
            });
        });

        // Search
        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') performSearch();
        });

        function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;
            
            searchStartTime = Date.now();
            closeResults();
            loadingDiv.classList.remove('hidden');
            searchBtn.disabled = true;
            searchBtn.textContent = 'Searching...';
            updateSystemStatus(true);
            
            // Hide progress bar for people search
            if (currentTool === 'person') {
                document.querySelector('.progress-bar').style.display = 'none';
                document.querySelector('.progress-text').style.display = 'none';
            }
            
            // Route to appropriate search
            if (currentTool === 'social') {
                searchSocial(query);
            } else if (currentTool === 'email') {
                searchEmail(query);
            } else if (currentTool === 'phone') {
                searchPhone(query);
            } else if (currentTool === 'person') {
                searchPerson(query);
            } else if (currentTool === 'maigret') {
                searchMaigret(query);
            } else if (currentTool === 'username') {
                searchSherlock(query);
            } else if (currentTool === 'holehe') {
                searchHolehe(query);
            } else if (currentTool === 'ip') {
                searchIP(query);
            } else if (currentTool === 'domain') {
                searchDomain(query);
            }
        }

        // API Calls
        async function searchSocial(query) {
            const type = query.includes('@') ? 'email' : 'username';
            const checkboxes = document.querySelectorAll('#socialCategories input[type="checkbox"]:checked');
            const tags = Array.from(checkboxes).map(cb => cb.value);
            startStreaming('/api/social/stream', { query: query, type, tags: tags });
        }
        
        async function searchMaigret(query) {
            startStreaming('/api/username/maigret', { username: query, limit: 300 });
        }
        
        async function searchSherlock(query) {
            startStreaming('/api/username/stream', { username: query });
        }

        async function searchEmail(query) {
            const checkboxes = document.querySelectorAll('#socialCategories input[type="checkbox"]:checked');
            const tags = Array.from(checkboxes).map(cb => cb.value);
            startStreaming('/api/email/stream', { email: query, tags: tags });
        }

        async function searchPhone(query) {
            try {
                const res = await fetch('/api/phone', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: query })
                });
                const data = await res.json();
                showPhoneResults(data);
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = 'Search';
                updateSystemStatus(false);
            }
        }

        async function searchPerson(query) {
            startStreaming('/api/person/stream', { name: query });
        }

        async function searchMaigret(query) {
            startStreaming('/api/username/maigret', { username: query, limit: 50 });
        }

        async function searchSherlock(query) {
            startStreaming('/api/username/stream', { username: query });
        }

        async function searchHolehe(query) {
            startStreaming('/api/email/holehe', { email: query });
        }

        async function searchIP(query) {
            try {
                const res = await fetch('/api/ip', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip: query })
                });
                const data = await res.json();
                showIPResults(data);
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = 'Search';
                updateSystemStatus(false);
            }
        }

        async function searchDomain(query) {
            try {
                const res = await fetch('/api/domain', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ domain: query })
                });
                const data = await res.json();
                showDomainResults(data);
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = 'Search';
                updateSystemStatus(false);
            }
        }

        // Streaming
        let searchCancelled = false;
        async function startStreaming(endpoint, body) {
            if (eventSource) eventSource.close();
            searchCancelled = false;
            
            const searchStartTime = Date.now();
            let lastUpdateTime = searchStartTime;
            let lastChecked = 0;
            
            searchBtn.disabled = true;
            searchBtn.textContent = 'Searching...';
            updateSystemStatus(true);
            
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let finished = false;
                
                while (true) {
                    if (searchCancelled) {
                        finished = true;
                        break;
                    }
                    
                    const { done, value } = await reader.read();
                    if (done || finished) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (searchCancelled) {
                            finished = true;
                            break;
                        }
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                console.log('SSE message:', data);
                                if (data.progress) {
                                    const p = data.progress;
                                    const checked = p.checked !== undefined ? p.checked : (p.completed || 0);
                                    const total = p.total || 1;
                                    const percent = p.percent !== undefined ? p.percent : Math.round((checked / total) * 100);
                                    progressFill.style.width = percent + '%';
                                    
                                    // Calculate time estimate
                                    const now = Date.now();
                                    const elapsedSecs = (now - searchStartTime) / 1000;
                                    let timeEstimate = '';
                                    if (checked > lastChecked) {
                                        const rate = checked / elapsedSecs; // sites per second
                                        const remaining = total - checked;
                                        const secsRemaining = remaining / rate;
                                        if (secsRemaining > 60) {
                                            timeEstimate = ` (~${Math.round(secsRemaining/60)}m remaining)`;
                                        } else if (secsRemaining > 0) {
                                            timeEstimate = ` (~${Math.round(secsRemaining)}s remaining)`;
                                        }
                                    }
                                    lastChecked = checked;
                                    lastUpdateTime = now;
                                    
                                    progressText.textContent = `${checked}/${total}${p.current_site ? ' - ' + p.current_site : ''}${timeEstimate}`;
                                }
                                if (data.complete) {
                                    console.log('Complete! Result keys:', data.result ? Object.keys(data.result) : 'no result');
                                    showResults(data.result);
                                    finished = true;
                                }
                                if (data.error) {
                                    showError(data.error);
                                    finished = true;
                                }
                            } catch (e) {
                                console.error('Parse error:', e);
                            }
                        }
                    }
                }
                
                if (!finished) {
                    loadingDiv.classList.add('hidden');
                }
            } catch (e) {
                showError(e.message);
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = 'Search';
                updateSystemStatus(false);
            }
        }
        
        // Utility functions
        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = '✓';
                setTimeout(() => { btn.textContent = '⎘'; }, 1500);
            }).catch(() => {
                btn.textContent = '✕';
                setTimeout(() => { btn.textContent = '⎘'; }, 1500);
            });
        }

        // Display functions
        function showResults(data) {
            loadingDiv.classList.add('hidden');
            resultsDiv.classList.remove('hidden');
            
            // Check if it's person search data
            if (data.search_links || data.dorks_results) {
                showPersonResults(data);
                return;
            }
            
            // Calculate elapsed time
            const elapsed = searchStartTime ? Math.round((Date.now() - searchStartTime) / 1000) : 0;
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            const elapsedStr = minutes > 0 ? `${minutes}m ${seconds}s` : `${seconds}s`;
            
            const found = data.platforms || data.found || data.findings || [];
            
            // Get found count - handle different data structures
            const foundCount = data.found_count !== undefined ? data.found_count : found.filter(f => f.exists).length;
            
            // Sort: found first, then unknown, then not found
            const sortedResults = [...found].sort((a, b) => {
                const scoreA = a.exists === true ? 90 : a.exists === false ? 20 : 50;
                const scoreB = b.exists === true ? 90 : b.exists === false ? 20 : 50;
                return scoreB - scoreA;
            });
            
            const renderResult = (f) => {
                const status = f.exists === true ? 'found' : f.exists === false ? 'not-found' : 'unknown';
                const statusLabel = f.exists === true ? 'FOUND' : f.exists === false ? 'NOT FOUND' : 'UNKNOWN';
                const score = f.exists === true ? 90 : f.exists === false ? 20 : 50;
                const scoreClass = score >= 70 ? 'high' : score >= 50 ? 'medium' : 'low';
                const scoreLabel = score >= 70 ? 'High' : score >= 50 ? 'Med' : 'Low';
                return `
                    <div class="result-item ${f.exists ? 'found' : ''}">
                        <div class="result-info">
                            <div class="result-name">${f.platform || f.site || f.service}</div>
                            ${f.url ? `<div class="url-row"><a href="${f.url}" target="_blank" class="result-url">${f.url}</a><button class="copy-btn" onclick="copyToClipboard('${f.url}', this)" title="Copy URL">⎘</button></div>` : ''}
                            <div class="result-meta">
                                <span class="confidence-badge ${scoreClass}">${scoreLabel} ${score}%</span>
                            </div>
                        </div>
                        <span class="result-status ${status}">${statusLabel}</span>
                    </div>
                `;
            };
            
            const html = `
                <div class="stats">
                    <div class="stat"><div class="stat-value">${foundCount}</div><div class="stat-label">Found</div></div>
                    <div class="stat"><div class="stat-value">${data.platforms_checked || data.total_checked || found.length}</div><div class="stat-label">Checked</div></div>
                    <div class="stat"><div class="stat-value">${elapsedStr}</div><div class="stat-label">Time</div></div>
                </div>
                ${sortedResults.length ? sortedResults.map(renderResult).join('') : '<div class="empty">No results found</div>'}
            `;
            resultsContent.innerHTML = html;
        }

        function showPhoneResults(data) {
            loadingDiv.classList.add('hidden');
            resultsDiv.classList.remove('hidden');
            
            if (data.error) {
                resultsContent.innerHTML = `<div class="empty">${data.error}</div>`;
                return;
            }
            
            resultsContent.innerHTML = `
                <div class="card">
                    <h3>Phone Information</h3>
                    <div class="grid-2">
                        <div class="grid-item"><div class="label">Valid</div><div class="value">${data.valid ? 'Yes' : 'No'}</div></div>
                        <div class="grid-item"><div class="label">Country</div><div class="value">${data.country || 'Unknown'}</div></div>
                        <div class="grid-item"><div class="label">Carrier</div><div class="value">${data.carrier || 'Unknown'}</div></div>
                        <div class="grid-item"><div class="label">Formatted</div><div class="value">${data.formatted || 'N/A'}</div></div>
                    </div>
                </div>
                ${data.services ? `
                    <div class="card">
                        <h3>Messaging</h3>
                        <div class="grid-2">
                            ${data.services.whatsapp ? `
                                <div class="grid-item">
                                    <div class="label">WhatsApp</div>
                                    <div class="value">${data.services.whatsapp.exists === true ? 'Found ✓' : data.services.whatsapp.exists === false ? 'Not found' : data.services.whatsapp.note || 'Unknown'}</div>
                                </div>
                            ` : ''}
                            ${data.services.telegram ? `
                                <div class="grid-item">
                                    <div class="label">Telegram</div>
                                    <div class="value">${data.services.telegram.exists === true ? 'Found ✓' : data.services.telegram.exists === false ? 'Not found' : data.services.telegram.note || 'Unknown'}</div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                ` : ''}
            `;
        }

        function showPersonResults(data) {
            loadingDiv.classList.add('hidden');
            // Hide progress bar for people search
            document.querySelector('.progress-bar').style.display = 'none';
            document.querySelector('.progress-text').style.display = 'none';
            resultsDiv.classList.remove('hidden');
            
            // Calculate elapsed time
            const elapsed = searchStartTime ? Math.round((Date.now() - searchStartTime) / 1000) : 0;
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            const elapsedStr = minutes > 0 ? `${minutes}m ${seconds}s` : `${seconds}s`;
            
            const searchLinks = data.search_links || [];
            const dorksResults = data.dorks_results || [];
            const total = data.total_results || 0;
            
            const categoryScore = {
                'social_media': 80,
                'files': 70,
                'news': 60,
                'general': 50
            };
            
            // Sort dorks results by confidence score (highest first)
            const sortedDorks = [...dorksResults].sort((a, b) => {
                const scoreA = categoryScore[a.category] || 50;
                const scoreB = categoryScore[b.category] || 50;
                return scoreB - scoreA;
            });
            
            const renderDork = (dork) => {
                const score = categoryScore[dork.category] || 50;
                const scoreClass = score >= 70 ? 'high' : score >= 50 ? 'medium' : 'low';
                const scoreLabel = score >= 70 ? 'High' : score >= 50 ? 'Med' : 'Low';
                return `
                    <div class="result-item found">
                        <div class="result-info">
                            <div class="result-name">${dork.domain}</div>
                            ${dork.url ? `<div class="url-row"><a href="${dork.url}" target="_blank" class="result-url">${dork.url}</a><button class="copy-btn" onclick="copyToClipboard('${dork.url}', this)" title="Copy URL">⎘</button></div>` : ''}
                            <div class="result-meta">
                                <span class="category">${dork.category}</span>
                                <span class="confidence-badge ${scoreClass}">${scoreLabel} ${score}%</span>
                            </div>
                        </div>
                    </div>
                `;
            };
            
            const renderLink = (link) => `
                <div class="result-item">
                    <div class="result-info">
                        <div class="result-name">${link.name || link.engine}</div>
                        ${link.url ? `<div class="url-row"><a href="${link.url}" target="_blank" class="result-url">${link.url}</a><button class="copy-btn" onclick="copyToClipboard('${link.url}', this)" title="Copy URL">⎘</button></div>` : ''}
                    </div>
                </div>
            `;
            
            resultsContent.innerHTML = `
                <div class="stats">
                    <div class="stat"><div class="stat-value">${total}</div><div class="stat-label">Total Results</div></div>
                    <div class="stat"><div class="stat-value">${dorksResults.length}</div><div class="stat-label">Dorks Found</div></div>
                    <div class="stat"><div class="stat-value">${searchLinks.length}</div><div class="stat-label">Search Links</div></div>
                    <div class="stat"><div class="stat-value">${elapsedStr}</div><div class="stat-label">Time</div></div>
                </div>
                ${dorksResults.length ? `
                    <div class="card">
                        <h3>DuckDuckGo Results (${dorksResults.length})</h3>
                        <div class="result-list">
                            ${sortedDorks.map(renderDork).join('')}
                        </div>
                    </div>
                ` : ''}
                ${searchLinks.length ? `
                    <div class="card">
                        <h3>Search Links (${searchLinks.length})</h3>
                        <div class="result-list">
                            ${searchLinks.map(renderLink).join('')}
                        </div>
                    </div>
                ` : ''}
                ${total === 0 ? '<div class="empty">No results found</div>' : ''}
            `;
        }

        function showDorksResults(data) {
            loadingDiv.classList.add('hidden');
            resultsDiv.classList.remove('hidden');
            
            if (data.error) {
                resultsContent.innerHTML = `<div class="empty">${data.error}</div>`;
                return;
            }
            
            const cats = data.categories || {};
            const social = cats.social_media || [];
            const files = cats.files || [];
            const news = cats.news || [];
            const general = cats.general || [];
            
            resultsContent.innerHTML = `
                <div class="stats">
                    <div class="stat"><div class="stat-value">${data.total_results || 0}</div><div class="stat-label">Links Found</div></div>
                </div>
                ${social.length ? `
                    <div class="card">
                        <h3>Social Media</h3>
                        ${social.map(s => `
                            <div class="result-item found">
                                <div class="result-info">
                                    <div class="result-name">${s.domain}</div>
                                    <a href="${s.url}" target="_blank" class="result-url">${s.url}</a>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                ` : ''}
                ${files.length ? `
                    <div class="card">
                        <h3>Files (PDF, DOC, etc)</h3>
                        ${files.map(f => `
                            <div class="result-item found">
                                <div class="result-info">
                                    <div class="result-name">${f.domain}</div>
                                    <a href="${f.url}" target="_blank" class="result-url">${f.url}</a>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                ` : ''}
                ${news.length ? `
                    <div class="card">
                        <h3>News</h3>
                        ${news.map(n => `
                            <div class="result-item found">
                                <div class="result-info">
                                    <div class="result-name">${n.domain}</div>
                                    <a href="${n.url}" target="_blank" class="result-url">${n.url}</a>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                ` : ''}
                ${general.length ? `
                    <div class="card">
                        <h3>Other Results</h3>
                        ${general.map(g => `
                            <div class="result-item found">
                                <div class="result-info">
                                    <div class="result-name">${g.domain}</div>
                                    <a href="${g.url}" target="_blank" class="result-url">${g.url}</a>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                ` : ''}
                ${!data.total_results ? '<div class="empty">No results found</div>' : ''}
            `;
        }

        function showIPResults(data) {
            loadingDiv.classList.add('hidden');
            resultsDiv.classList.remove('hidden');
            
            if (data.error) {
                resultsContent.innerHTML = `<div class="empty">${data.error}</div>`;
                return;
            }
            
            resultsContent.innerHTML = `
                <div class="card">
                    <h3>IP Information</h3>
                    <div class="grid-2">
                        <div class="grid-item"><div class="label">IP</div><div class="value">${data.ip}</div></div>
                        <div class="grid-item"><div class="label">Country</div><div class="value">${data.country || 'Unknown'}</div></div>
                        <div class="grid-item"><div class="label">City</div><div class="value">${data.city || 'Unknown'}</div></div>
                        <div class="grid-item"><div class="label">ISP</div><div class="value">${data.isp || 'Unknown'}</div></div>
                    </div>
                </div>
            `;
        }

        function showDomainResults(data) {
            loadingDiv.classList.add('hidden');
            resultsDiv.classList.remove('hidden');
            
            if (data.error) {
                resultsContent.innerHTML = `<div class="empty">${data.error}</div>`;
                return;
            }
            
            resultsContent.innerHTML = `
                <div class="card">
                    <h3>Domain: ${data.domain}</h3>
                    <div class="grid-2">
                        <div class="grid-item"><div class="label">Registrar</div><div class="value">${data.registrar || 'Unknown'}</div></div>
                        <div class="grid-item"><div class="label">Created</div><div class="value">${data.created || 'Unknown'}</div></div>
                        <div class="grid-item"><div class="label">Expires</div><div class="value">${data.expires || 'Unknown'}</div></div>
                        <div class="grid-item"><div class="label">Nameservers</div><div class="value">${(data.nameservers || []).join(', ') || 'Unknown'}</div></div>
                    </div>
                </div>
            `;
        }

        function showError(msg) {
            loadingDiv.classList.add('hidden');
            resultsDiv.classList.remove('hidden');
            resultsContent.innerHTML = `<div class="empty" style="color:var(--red)">Error: ${msg}</div>`;
        }

        function closeResults() {
            stopSearch();
            resultsDiv.classList.add('hidden');
            // Restore progress bar for next search
            document.querySelector('.progress-bar').style.display = '';
            document.querySelector('.progress-text').style.display = '';
            // Re-enable search button in case search was cancelled mid-flight
            searchBtn.disabled = false;
            searchBtn.textContent = 'Search';
            updateSystemStatus(false);
        }

        function stopSearch() {
            searchCancelled = true;
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            loadingDiv.classList.add('hidden');
            searchBtn.disabled = false;
            searchBtn.textContent = 'Search';
            updateSystemStatus(false);
            progressFill.style.width = '0%';
            progressText.textContent = '';
        }

        // Modals
        function toggleHistory() {
            const modal = document.getElementById('historyModal');
            modal.classList.toggle('active');
            if (modal.classList.contains('active')) loadHistory();
        }

        function toggleHealthModal() {
            const modal = document.getElementById('healthModal');
            modal.classList.toggle('active');
        }

        function openChangelog() {
            const modal = document.getElementById('changelogModal');
            modal.classList.toggle('active');
        }

        function restartApp() {
            if (confirm('Restart the application?')) {
                fetch('/api/system/restart', { method: 'POST' })
                    .then(() => setTimeout(() => window.location.reload(), 2000));
            }
        }

        function loadHistory() {
            fetch('/api/history')
                .then(r => r.json())
                .then(data => {
                    const list = data.history || [];
                    document.getElementById('historyContent').innerHTML = list.length ? 
                        list.map(h => `
                            <div class="history-item">
                                <div class="history-info">
                                    <div class="history-query">${h.query}</div>
                                    <div class="history-meta">${h.tool} • ${new Date(h.timestamp).toLocaleDateString()}</div>
                                </div>
                            </div>
                        `).join('') : '<div class="empty">No history</div>';
                });
        }

        // Init
        fetch('/api/version').then(r => r.json()).then(data => {
            document.getElementById('versionBadge').textContent = data.version;
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                searchInput.focus();
            }
        });
    </script>
</body>
</html>
