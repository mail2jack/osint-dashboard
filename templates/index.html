<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 16v-4M12 8h.01"></path>
                </svg>
                <h1>OSINT <span>Dashboard</span></h1>
            </div>
            <div class="header-actions">
                <button class="btn-icon" onclick="toggleHistory()" title="History">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    History
                </button>
                <button class="btn-icon" onclick="toggleHealthModal()" title="Health">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                </button>
                <button class="btn-icon" onclick="restartApp()" title="Restart">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                </button>
                <button class="btn-icon" onclick="openChangelog()" title="Changelog">v<span id="versionBadge">2.0</span></button>
            </div>
        </header>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-group">
                <button class="toolbar-btn active" data-tool="social">Social</button>
                <button class="toolbar-btn" data-tool="person">People</button>
                <button class="toolbar-btn" data-tool="email">Email</button>
                <button class="toolbar-btn" data-tool="phone">Phone</button>
            </div>
            <div class="toolbar-group">
                <button class="toolbar-btn" data-tool="maigret">Maigret</button>
                <button class="toolbar-btn" data-tool="username">Sherlock</button>
                <button class="toolbar-btn" data-tool="holehe">Holehe</button>
            </div>
            <div class="toolbar-group">
                <button class="toolbar-btn" data-tool="ip">IP</button>
                <button class="toolbar-btn" data-tool="domain">Domain</button>
            </div>
        </div>

        <!-- Search -->
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Enter search query...">
            <button id="searchBtn" class="search-btn">Search</button>
        </div>

        <!-- Options -->
        <div class="options" id="optionsBar" style="display:none">
            <label>Platforms:</label>
            <select id="siteCategory">
                <option value="all">All Sites</option>
                <option value="social">Social Media</option>
                <option value="developer">Developer</option>
                <option value="gaming">Gaming</option>
            </select>
            <span class="options-count" id="siteCount">56 sites</span>
        </div>

        <!-- Results -->
        <div id="results" class="results hidden">
            <div class="results-header">
                <h3>Results</h3>
                <button class="close-btn" onclick="closeResults()">&times;</button>
            </div>
            <div id="resultsContent" class="results-content"></div>
        </div>

        <!-- Loading -->
        <div id="loading" class="hidden">
            <div class="loading">
                <div class="spinner"></div>
                <p>Searching...</p>
                <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
                <p class="progress-text" id="progressText">Preparing...</p>
                <div class="search-controls">
                    <button class="btn-icon danger" onclick="stopSearch()">■ Stop</button>
                </div>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div class="modal-overlay" id="historyModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Search History</h3>
                <button class="close-btn" onclick="toggleHistory()">&times;</button>
            </div>
            <div class="modal-body" id="historyContent">
                <div class="empty">No history yet</div>
            </div>
        </div>
    </div>

    <!-- Health Modal -->
    <div class="modal-overlay" id="healthModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Platform Status</h3>
                <button class="close-btn" onclick="toggleHealthModal()">&times;</button>
            </div>
            <div class="modal-body" id="healthContent">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <!-- Changelog Modal -->
    <div class="modal-overlay" id="changelogModal">
        <div class="modal">
            <div class="modal-header">
                <h3>What's New</h3>
                <button class="close-btn" onclick="openChangelog()">&times;</button>
            </div>
            <div class="modal-body" id="changelogContent">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        // State
        let currentTool = 'social';
        let eventSource = null;

        // DOM Elements
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsDiv = document.getElementById('results');
        const resultsContent = document.getElementById('resultsContent');
        const loadingDiv = document.getElementById('loading');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const toolbarBtns = document.querySelectorAll('.toolbar-btn');

        // Placeholders
        const placeholders = {
            social: 'Enter username or email...',
            person: 'Enter full name (e.g., John Smith)',
            email: 'Enter email address...',
            phone: 'Enter phone number (+31612345678)',
            whatsapp: 'Enter phone number...',

            maigret: 'Enter username (deep search)...',
            username: 'Enter username...',
            holehe: 'Enter email for deep search...',
            ip: 'Enter IP address...',
            domain: 'Enter domain name...'
        };

        // Tool selection
        const optionsBar = document.getElementById('optionsBar');
        
        toolbarBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                toolbarBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTool = btn.dataset.tool;
                searchInput.placeholder = placeholders[currentTool];
                searchInput.value = '';
                closeResults();
                
                // Show/hide options based on tool
                optionsBar.style.display = (currentTool === 'social') ? 'flex' : 'none';
            });
        });

        // Update site count on change
        document.getElementById('siteCategory').addEventListener('change', function() {
            const counts = { all: 56, social: 17, developer: 9, gaming: 4 };
            document.getElementById('siteCount').textContent = (counts[this.value] || 56) + ' sites';
        });

        // Search
        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') performSearch();
        });

        function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;
            
            closeResults();
            loadingDiv.classList.remove('hidden');
            searchBtn.disabled = true;
            searchBtn.textContent = 'Searching...';
            
            // Route to appropriate search
            if (currentTool === 'social') {
                searchSocial(query);
            } else if (currentTool === 'email') {
                searchEmail(query);
            } else if (currentTool === 'phone') {
                searchPhone(query);
            } else if (currentTool === 'person') {
                searchPerson(query);
            } else if (currentTool === 'maigret') {
                searchMaigret(query);
            } else if (currentTool === 'username') {
                searchSherlock(query);
            } else if (currentTool === 'holehe') {
                searchHolehe(query);
            } else if (currentTool === 'ip') {
                searchIP(query);
            } else if (currentTool === 'domain') {
                searchDomain(query);
            }
        }

        // API Calls
        async function searchSocial(query) {
            const type = query.includes('@') ? 'email' : 'username';
            const category = document.getElementById('siteCategory').value;
            startStreaming('/api/social/stream', { query: query, type, category });
        }

        async function searchEmail(query) {
            startStreaming('/api/email/stream', { email: query });
        }

        async function searchPhone(query) {
            try {
                const res = await fetch('/api/phone', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: query })
                });
                const data = await res.json();
                showPhoneResults(data);
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = 'Search';
            }
        }

        async function searchPerson(query) {
            try {
                const res = await fetch('/api/name-search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: query })
                });
                const data = await res.json();
                showPersonResults(data);
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = 'Search';
            }
        }

        async function searchMaigret(query) {
            startStreaming('/api/username/maigret', { username: query, limit: 50 });
        }

        async function searchSherlock(query) {
            startStreaming('/api/username/stream', { username: query });
        }

        async function searchHolehe(query) {
            startStreaming('/api/username/holehe', { email: query });
        }

        async function searchIP(query) {
            try {
                const res = await fetch('/api/ip', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip: query })
                });
                const data = await res.json();
                showIPResults(data);
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = 'Search';
            }
        }

        async function searchDomain(query) {
            try {
                const res = await fetch('/api/domain', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ domain: query })
                });
                const data = await res.json();
                showDomainResults(data);
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = 'Search';
            }
        }

        // Streaming
        async function startStreaming(endpoint, body) {
            if (eventSource) eventSource.close();
            
            searchBtn.disabled = true;
            searchBtn.textContent = 'Searching...';
            
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let finished = false;
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done || finished) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.progress) {
                                    progressFill.style.width = data.progress.percent + '%';
                                    progressText.textContent = `${data.progress.checked}/${data.progress.total} - ${data.progress.current_site || ''}`;
                                }
                                if (data.complete) {
                                    showResults(data.result);
                                    finished = true;
                                }
                                if (data.error) {
                                    showError(data.error);
                                    finished = true;
                                }
                            } catch (e) {}
                        }
                    }
                }
                
                if (!finished) {
                    loadingDiv.classList.add('hidden');
                }
            } catch (e) {
                showError(e.message);
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = 'Search';
            }
        }

        // Display functions
        function showResults(data) {
            loadingDiv.classList.add('hidden');
            resultsDiv.classList.remove('hidden');
            
            const found = data.findings || [];
            const html = `
                <div class="stats">
                    <div class="stat"><div class="stat-value">${found.length}</div><div class="stat-label">Found</div></div>
                    <div class="stat"><div class="stat-value">${data.platforms_checked || found.length}</div><div class="stat-label">Checked</div></div>
                </div>
                ${found.length ? found.map(f => `
                    <div class="result-item ${f.exists ? 'found' : ''}">
                        <div class="result-info">
                            <div class="result-name">${f.site || f.service}</div>
                            <a href="${f.url}" target="_blank" class="result-url">${f.url}</a>
                        </div>
                        <span class="result-status ${f.exists ? 'found' : 'not-found'}">${f.exists ? 'FOUND' : 'NOT FOUND'}</span>
                    </div>
                `).join('') : '<div class="empty">No results found</div>'}
            `;
            resultsContent.innerHTML = html;
        }

        function showPhoneResults(data) {
            loadingDiv.classList.add('hidden');
            resultsDiv.classList.remove('hidden');
            
            if (data.error) {
                resultsContent.innerHTML = `<div class="empty">${data.error}</div>`;
                return;
            }
            
            resultsContent.innerHTML = `
                <div class="card">
                    <h3>Phone Information</h3>
                    <div class="grid-2">
                        <div class="grid-item"><div class="label">Valid</div><div class="value">${data.valid ? 'Yes' : 'No'}</div></div>
                        <div class="grid-item"><div class="label">Country</div><div class="value">${data.country || 'Unknown'}</div></div>
                        <div class="grid-item"><div class="label">Carrier</div><div class="value">${data.carrier || 'Unknown'}</div></div>
                        <div class="grid-item"><div class="label">Formatted</div><div class="value">${data.formatted || 'N/A'}</div></div>
                    </div>
                </div>
                ${data.services ? `
                    <div class="card">
                        <h3>Messaging</h3>
                        <div class="grid-2">
                            ${data.services.whatsapp ? `<div class="grid-item"><div class="label">WhatsApp</div><div class="value">${data.services.whatsapp.exists ? 'Found' : 'Not found'}</div></div>` : ''}
                            ${data.services.telegram ? `<div class="grid-item"><div class="label">Telegram</div><div class="value">${data.services.telegram.exists ? 'Found' : 'Not found'}</div></div>` : ''}
                        </div>
                    </div>
                ` : ''}
            `;
        }

        function showPersonResults(data) {
            loadingDiv.classList.add('hidden');
            resultsDiv.classList.remove('hidden');
            
            const accounts = data.accounts || [];
            const found = accounts.filter(a => a.exists);
            
            resultsContent.innerHTML = `
                <div class="stats">
                    <div class="stat"><div class="stat-value">${found.length}</div><div class="stat-label">Found</div></div>
                    <div class="stat"><div class="stat-value">${accounts.length}</div><div class="stat-label">Checked</div></div>
                </div>
                ${found.length ? found.map(f => `
                    <div class="result-item found">
                        <div class="result-info">
                            <div class="result-name">${f.site}</div>
                            <a href="${f.url}" target="_blank" class="result-url">${f.url}</a>
                        </div>
                    </div>
                `).join('') : '<div class="empty">No accounts found</div>'}
            `;
        }

        function showIPResults(data) {
            loadingDiv.classList.add('hidden');
            resultsDiv.classList.remove('hidden');
            
            if (data.error) {
                resultsContent.innerHTML = `<div class="empty">${data.error}</div>`;
                return;
            }
            
            resultsContent.innerHTML = `
                <div class="card">
                    <h3>IP Information</h3>
                    <div class="grid-2">
                        <div class="grid-item"><div class="label">IP</div><div class="value">${data.ip}</div></div>
                        <div class="grid-item"><div class="label">Country</div><div class="value">${data.country || 'Unknown'}</div></div>
                        <div class="grid-item"><div class="label">City</div><div class="value">${data.city || 'Unknown'}</div></div>
                        <div class="grid-item"><div class="label">ISP</div><div class="value">${data.isp || 'Unknown'}</div></div>
                    </div>
                </div>
            `;
        }

        function showDomainResults(data) {
            loadingDiv.classList.add('hidden');
            resultsDiv.classList.remove('hidden');
            
            if (data.error) {
                resultsContent.innerHTML = `<div class="empty">${data.error}</div>`;
                return;
            }
            
            resultsContent.innerHTML = `
                <div class="card">
                    <h3>Domain: ${data.domain}</h3>
                    <div class="grid-2">
                        <div class="grid-item"><div class="label">Registrar</div><div class="value">${data.registrar || 'Unknown'}</div></div>
                        <div class="grid-item"><div class="label">Created</div><div class="value">${data.created || 'Unknown'}</div></div>
                        <div class="grid-item"><div class="label">Expires</div><div class="value">${data.expires || 'Unknown'}</div></div>
                        <div class="grid-item"><div class="label">Nameservers</div><div class="value">${(data.nameservers || []).join(', ') || 'Unknown'}</div></div>
                    </div>
                </div>
            `;
        }

        function showError(msg) {
            loadingDiv.classList.add('hidden');
            resultsDiv.classList.remove('hidden');
            resultsContent.innerHTML = `<div class="empty" style="color:var(--red)">Error: ${msg}</div>`;
        }

        function closeResults() {
            stopSearch();
            resultsDiv.classList.add('hidden');
        }

        function stopSearch() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            loadingDiv.classList.add('hidden');
            searchBtn.disabled = false;
            searchBtn.textContent = 'Search';
        }

        // Modals
        function toggleHistory() {
            const modal = document.getElementById('historyModal');
            modal.classList.toggle('active');
            if (modal.classList.contains('active')) loadHistory();
        }

        function toggleHealthModal() {
            const modal = document.getElementById('healthModal');
            modal.classList.toggle('active');
        }

        function openChangelog() {
            const modal = document.getElementById('changelogModal');
            modal.classList.toggle('active');
        }

        function restartApp() {
            if (confirm('Restart the application?')) {
                fetch('/api/system/restart', { method: 'POST' })
                    .then(() => setTimeout(() => window.location.reload(), 2000));
            }
        }

        function loadHistory() {
            fetch('/api/history')
                .then(r => r.json())
                .then(data => {
                    const list = data.history || [];
                    document.getElementById('historyContent').innerHTML = list.length ? 
                        list.map(h => `
                            <div class="history-item">
                                <div class="history-info">
                                    <div class="history-query">${h.query}</div>
                                    <div class="history-meta">${h.tool} • ${new Date(h.timestamp).toLocaleDateString()}</div>
                                </div>
                            </div>
                        `).join('') : '<div class="empty">No history</div>';
                });
        }

        // Init
        fetch('/api/version').then(r => r.json()).then(data => {
            document.getElementById('versionBadge').textContent = data.version;
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                searchInput.focus();
            }
        });
    </script>
</body>
</html>
