<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>WhatsApp QR Koppeling</title>
<style>
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #1a1a2e; color: #fff; font-family: sans-serif; flex-direction: column; gap: 1rem; }
  img { border: 8px solid #fff; border-radius: 12px; max-width: 90vw; }
  p { margin: 0; font-size: 1.1rem; }
  .status { color: #888; font-size: 0.9rem; }
</style>
</head>
<body>
  <img id="qr" src="/static/wa_qr.png?t={{ timestamp }}" alt="QR Code">
  <p>Scan met WhatsApp → Gekoppelde apparaten</p>
  <p class="status" id="status">QR ververst om de 30s</p>
  <script>
    setInterval(() => {
      document.getElementById('qr').src = '/static/wa_qr.png?t=' + Date.now();
    }, 30000);
    setInterval(() => {
      fetch('/api/wa-status').then(r => r.json()).then(d => {
        if (d.connected) {
          document.getElementById('status').textContent = '✅ Verbonden!';
        }
      }).catch(() => {});
    }, 5000);
  </script>
</body>
</html>
