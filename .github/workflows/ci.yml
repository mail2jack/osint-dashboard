name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: "app.py cms tests scripts license-server"
          args: "--select E4,E7,E9,F --ignore E402,E711,E712"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python3 -m mypy cms/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python3 -m pytest tests/ -v --tb=short -q
      - name: Bandit static analysis (informational — does not block)
        run: bandit -c bandit.yml -r app.py cms/ -ll -f sarif || true
      - name: Dependency vulnerability scan (blocking)
        run: |
          pip install pip-audit
          pip-audit -r requirements-lock.txt

  license-server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: license-server/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: license-server
      - run: python3 -m pytest tests/ -v --tb=short -q
        working-directory: license-server

  integration-postgres:
    runs-on: ubuntu-latest
    continue-on-error: true  # Do not block CI while we iron out Postgres compat
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cms_test
          POSTGRES_USER: cms_test
          POSTGRES_PASSWORD: cms_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: >-
          DATABASE_URL="postgresql://cms_test:cms_test@postgres:5432/cms_test"
          python3 -m pytest tests/ -v --tb=short -q
