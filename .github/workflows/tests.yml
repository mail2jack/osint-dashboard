name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        python-version: ["3.12"]

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest ruff mypy pre-commit bandit safety

    - name: Lint with ruff
      run: ruff check --fix --output-format=github .

    - name: Pre-commit checks
      run: pre-commit run --all-files --show-diff-on-failure || true

    - name: Type check with mypy
      run: mypy --config-file mypy.ini app.py cms/

    - name: Security scan with bandit
      run: bandit -c bandit.yml -r app.py cms/ -ll -f sarif || true

    - name: Check dependency vulnerabilities
      run: safety check -r requirements.txt --full-report || true

    - name: Run tests
      run: python -m pytest tests/ -v --tb=short
