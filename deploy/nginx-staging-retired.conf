# Staging is intentionally retired while no separate staging environment is available.
# Keep the hostname explicit so it cannot fall through to the production vhost.
server {
    listen 80;
    listen [::]:80;
    server_name staging.joost.iveras.com;
    return 410;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.joost.iveras.com;

    ssl_certificate /etc/letsencrypt/live/staging.joost.iveras.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.joost.iveras.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 410;
}
