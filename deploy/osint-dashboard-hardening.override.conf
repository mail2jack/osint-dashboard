# Iveras OSINT Dashboard — systemd sandboxing hardening drop-in
# ==============================================================
# Installed as /etc/systemd/system/osint-dashboard.service.d/hardening.conf
# by scripts/install_dashboard_hardening.sh. Survives deploys (sync_units.sh
# only syncs *.service/*.timer and never touches this drop-in).
#
# Design notes / constraints (keep in sync with RUNBOOK.md):
#   - The service WRITES to instance/ (sherlock cache, finding screenshots),
#     flask_session/ (filesystem sessions — no Redis in production),
#     static/uploads/ and reports/  -> listed in ReadWritePaths (rest of the
#     filesystem, incl. .env and .cms_key, stays read-only).
#   - UMask stays 0022: nginx (www-data) must keep reading uploaded files.
#   - No ProcSubset=pid: psutil reads /proc/meminfo for /health and telemetry.
#   - ProtectHome=read-only (not true): sherlock/holehe subprocesses may write
#     to $HOME (~osint).
#   - No SystemCallFilter=@system-service yet: gunicorn/python subprocesses
#     (sherlock, holehe, spiderfoot) may need syscalls outside the baseline.
#   - No PrivateNetwork: the app needs outbound access (SMTP, Stripe, APIs).
#
# Network: RestrictAddressFamilies keeps AF_UNIX (systemd notify), AF_INET(6)
# (local Postgres on 127.0.0.1:5432, outbound HTTPS/SMTP).
[Service]
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectSystem=strict
ReadWritePaths=/opt/osint-dashboard/instance /opt/osint-dashboard/flask_session /opt/osint-dashboard/static/uploads /opt/osint-dashboard/reports
ProtectHome=read-only
ProtectClock=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectHostname=true
ProtectProc=invisible
RestrictSUIDSGID=true
RestrictRealtime=true
RestrictNamespaces=true
LockPersonality=true
CapabilityBoundingSet=
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
UMask=0022