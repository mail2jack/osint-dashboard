[mypy]
python_version = 3.12
ignore_missing_imports = True
warn_unused_ignores = True
strict_optional = True
check_untyped_defs = True
no_implicit_optional = True

# Flask route tuples like return jsonify(...), 400 — runtime-valid
disable_error_code = return-value, func-returns-value, dict-item

# Pydantic @validate decorator adds validated_data at runtime
[mypy-cms.routes.*]
disable_error_code = attr-defined

[mypy-cms.validation]
disable_error_code = attr-defined
