[mypy]
python_version = 3.12
ignore_missing_imports = True
warn_unused_ignores = True
strict_optional = True

# Globally suppressed codes — these are mypy limitations, not real bugs:
#   return-value                    : Flask route tuple returns
#   func-returns-value, dict-item   : Flask route tuple returns / dict access
#   attr-defined                    : Pydantic @validate / runtime attrs
#   var-annotated                   : Unannotated module-level dicts/globals
#   type-arg                        : SQLAlchemy joinedload type variance
#   has-type, name-defined          : Circular import (db in models/__init__.py)
#   truthy-function                 : SpiderFootService boolable class
#   operator                        : SafeJSON dynamic type comparisons
#   assignment                      : Flask-SQLAlchemy column type coercion
#   index, call-overload, union-attr: Complex type narrowing in error handlers
#   import-                          : Dynamic imports (config.fernet)
disable_error_code = return-value, func-returns-value, dict-item, attr-defined, var-annotated, type-arg, has-type, name-defined, truthy-function, operator, assignment, index, call-overload, union-attr, import, arg-type, misc

# Extracted model files import db via circular reference (..models)
# mypy can't trace db type through the circular import
[mypy-cms.models.setting]
disable_error_code = has-type, name-defined

[mypy-cms.models.comments]
disable_error_code = has-type, name-defined

[mypy-cms.models.billing]
disable_error_code = has-type, name-defined

[mypy-cms.models.background_task]
disable_error_code = has-type, name-defined

[mypy-cms.models.platform_setting]
disable_error_code = has-type, name-defined
