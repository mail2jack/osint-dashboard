
services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/var/lib/postgresql/data/tls/server.crt", "-c", "ssl_key_file=/var/lib/postgresql/data/tls/server.key"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: cms_db
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  wa-service:
    build: wa-service
    ports:
      - "127.0.0.1:${WA_PORT:-3001}:3001"
    environment:
      PORT: 3001
      AUTH_DIR: /app/auth
      LOG_LEVEL: ${WA_LOG_LEVEL:-info}
    volumes:
      - wa_auth:/app/auth
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  app:
    build: .
    ports:
      - "127.0.0.1:${PORT:-5000}:5000"
    environment:
      FLASK_ENV: production
      SPIDERFOOT_URL: ${SPIDERFOOT_URL:-http://host.docker.internal:5001}
      SPIDERFOOT_USERNAME: ${SPIDERFOOT_USERNAME:-admin}
      SPIDERFOOT_PASSWORD: ${SPIDERFOOT_PASSWORD:-}
      DB_SSL_MODE: require
      DATABASE_URL: postgresql+psycopg2://cms:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/cms_db?sslmode=require
      REDIS_URL: redis://redis:6379/0
      CMS_ENCRYPTION_KEY: ${CMS_ENCRYPTION_KEY:?Set CMS_ENCRYPTION_KEY in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      WA_SERVICE_URL: http://wa-service:3001
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5000}
      INSTALL_ID: ${INSTALL_ID:-}
      INSTALL_TOKEN: ${INSTALL_TOKEN:-}
      PYTHONUNBUFFERED: 1
      LOG_FILE: /dev/null
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/static/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health?quick=1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  worker:
    build: .
    command: python3 worker.py default
    environment:
      FLASK_ENV: production
      DB_SSL_MODE: require
      DATABASE_URL: postgresql+psycopg2://cms:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/cms_db?sslmode=require
      REDIS_URL: redis://redis:6379/0
      CMS_ENCRYPTION_KEY: ${CMS_ENCRYPTION_KEY:?Set CMS_ENCRYPTION_KEY in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      INSTALL_ID: ${INSTALL_ID:-}
      INSTALL_TOKEN: ${INSTALL_TOKEN:-}
      PYTHONUNBUFFERED: 1
      LOG_FILE: /dev/null
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      disable: true
    profiles:
      - worker
    # Uncomment to enable by default:
    # profiles: []

  health-refresh:
    build: .
    command: >-
      sh -c 'while true; do
      python3 scripts/health_refresh.py || true;
      sleep 300;
      done'
    environment:
      FLASK_ENV: production
      DB_SSL_MODE: require
      DATABASE_URL: postgresql+psycopg2://cms:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/cms_db?sslmode=require
      REDIS_URL: redis://redis:6379/0
      CMS_ENCRYPTION_KEY: ${CMS_ENCRYPTION_KEY:?Set CMS_ENCRYPTION_KEY in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SPIDERFOOT_URL: ${SPIDERFOOT_URL:-http://host.docker.internal:5001}
      SPIDERFOOT_USERNAME: ${SPIDERFOOT_USERNAME:-admin}
      SPIDERFOOT_PASSWORD: ${SPIDERFOOT_PASSWORD:-}
      INSTALL_ID: ${INSTALL_ID:-}
      INSTALL_TOKEN: ${INSTALL_TOKEN:-}
      PYTHONUNBUFFERED: 1
      LOG_FILE: /dev/null
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      disable: true

volumes:
  pgdata:
  uploads:
  redis_data:
  wa_auth:
