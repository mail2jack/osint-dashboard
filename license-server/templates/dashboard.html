<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iveras Install Registry</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --border: #2b2f38;
    --text: #e6e8ee;
    --muted: #8b93a3;
    --accent: #4f8cff;
    --ok: #37c46a;
    --warn: #f2b03d;
    --bad: #ef5350;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  h1 { font-size: 1.35rem; margin: 0 0 0.25rem; }
  p.sub { color: var(--muted); margin: 0 0 1.25rem; }
  .stat {
    display: inline-block; margin-right: 1.5rem; margin-bottom: 1rem;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.6rem 1rem;
  }
  .stat b { display: block; font-size: 1.4rem; }
  .stat span { color: var(--muted); font-size: 0.8rem; }
  table {
    width: 100%; border-collapse: collapse;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  }
  th, td { text-align: left; padding: 0.6rem 0.8rem; font-size: 0.85rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { background: #20242c; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .ok { background: var(--ok); }
  .warn { background: var(--warn); }
  .bad { background: var(--bad); }
  .muted { color: var(--muted); }
  .small { font-size: 0.78rem; }
  .wrap { max-width: 100%; word-break: break-all; }
  #updated { color: var(--muted); font-size: 0.8rem; margin-top: 1rem; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 6px;
    padding: 0.45rem 0.9rem; cursor: pointer; font-size: 0.85rem;
  }
</style>
</head>
<body>
<h1>Iveras Install Registry</h1>
<p class="sub">Telemetry &amp; license server — alle geregistreerde installaties</p>

<div>
  <div class="stat"><b id="count">-</b><span>installs</span></div>
  <div class="stat"><b id="online">-</b><span>online &le; 48u</span></div>
  <div class="stat"><b id="stale">-</b><span>stale &gt; 48u</span></div>
</div>

<table>
  <thead>
    <tr>
      <th>Status</th>
      <th>Install ID</th>
      <th>Host</th>
      <th>IP</th>
      <th>System</th>
      <th>HW</th>
      <th>App</th>
      <th>Platform</th>
      <th>Registered</th>
      <th>Last seen</th>
    </tr>
  </thead>
  <tbody id="rows">
    <tr><td colspan="10" class="muted">Loading…</td></tr>
  </tbody>
</table>

<p id="updated"></p>
<button id="refresh">Refresh</button>

<script>
  function esc(s) {
    if (s === null || s === undefined) return "";
    return String(s).replace(/[&<>"']/g, function (c) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function ago(iso) {
    if (!iso) return "-";
    var t = Date.parse(iso);
    if (isNaN(t)) return "-";
    var d = Math.floor((Date.now() - t) / 60000);
    if (d < 1) return "now";
    if (d < 60) return d + "m";
    var h = Math.floor(d / 60);
    if (h < 48) return h + "h";
    return Math.floor(h / 24) + "d";
  }
  function full(iso) {
    return iso ? new Date(iso).toLocaleString() : "-";
  }
  function load() {
    fetch("/api/installs")
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        var rows = data.installs || [];
        var now = Date.now();
        var online = 0, stale = 0;
        rows.forEach(function (it) {
          var t = Date.parse(it.last_seen || it.registered_at || "");
          if (isNaN(t)) t = Date.now();
          var hours = (now - t) / 3600000;
          if (hours <= 48) online++; else stale++;
        });
        document.getElementById("count").textContent = rows.length;
        document.getElementById("online").textContent = online;
        document.getElementById("stale").textContent = stale;

        var tb = document.getElementById("rows");
        tb.innerHTML = rows.length ? "" :
          '<tr><td colspan="10" class="muted">No installs registered yet.</td></tr>';

        rows.forEach(function (it) {
          var t = Date.parse(it.last_seen || "");
          if (isNaN(t)) t = Date.now();
          var hours = (now - t) / 3600000;
          var cls = hours <= 48 ? "ok" : (hours <= 240 ? "warn" : "bad");
          var tr = document.createElement("tr");
          tr.innerHTML =
            '<td><span class="dot ' + cls + '"></span>' + ago(it.last_seen) + '</td>' +
            '<td class="wrap small">' + esc(it.install_id) + '</td>' +
            '<td>' + esc(it.hostname || "-") + '</td>' +
            '<td class="small">' + esc(it.public_ip || "-") +
              (it.local_ips && it.local_ips.length ? '<br><span class="muted">' + it.local_ips.map(esc).join(", ") + '</span>' : "") +
            '</td>' +
            '<td class="small">' + esc(it.os_name || "-") + ' ' + esc(it.os_version || "") +
              '<br><span class="muted">' + esc(it.kernel || "") + '</span></td>' +
            '<td class="small">' + esc(it.cpu_model || "-") +
              (it.cpu_count ? ' (' + it.cpu_count + ')' : "") +
              '<br><span class="muted">' + (it.ram_gb || "-") + ' GB RAM · ' + (it.disk_gb || "-") + ' GB disk</span></td>' +
            '<td>' + esc(it.app_version || "-") + '</td>' +
            '<td>' + esc(it.platform || "-") + '</td>' +
            '<td class="small" title="' + full(it.registered_at) + '">' + ago(it.registered_at) + '</td>' +
            '<td class="small" title="' + full(it.last_seen) + '">' + ago(it.last_seen) + '</td>';
          tb.appendChild(tr);
        });
        document.getElementById("updated").textContent =
          "Updated " + new Date().toLocaleTimeString() + " (server: " + (data.now || "") + ")";
      })
      .catch(function (e) {
        document.getElementById("rows").innerHTML =
          '<tr><td colspan="10" class="muted">Failed to load: ' + esc(e.message) + '</td></tr>';
      });
  }
  document.getElementById("refresh").addEventListener("click", load);
  load();
  setInterval(load, 60000);
</script>
</body>
</html>
