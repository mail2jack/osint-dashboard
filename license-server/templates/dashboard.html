<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iveras Install Registry</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --border: #2b2f38;
    --text: #e6e8ee;
    --muted: #8b93a3;
    --accent: #4f8cff;
    --ok: #37c46a;
    --warn: #f2b03d;
    --bad: #ef5350;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  h1 { font-size: 1.35rem; margin: 0 0 0.25rem; }
  p.sub { color: var(--muted); margin: 0 0 1.25rem; }
  .stat {
    display: inline-block; margin-right: 1.5rem; margin-bottom: 1rem;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.6rem 1rem;
  }
  .stat b { display: block; font-size: 1.4rem; }
  .stat span { color: var(--muted); font-size: 0.8rem; }
  table {
    width: 100%; border-collapse: collapse;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  }
  th, td { text-align: left; padding: 0.6rem 0.8rem; font-size: 0.85rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { background: #20242c; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .ok { background: var(--ok); }
  .warn { background: var(--warn); }
  .bad { background: var(--bad); }
  .muted { color: var(--muted); }
  .small { font-size: 0.78rem; }
  .wrap { max-width: 100%; word-break: break-all; }
  #updated { color: var(--muted); font-size: 0.8rem; margin-top: 1rem; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 6px;
    padding: 0.45rem 0.9rem; cursor: pointer; font-size: 0.85rem;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.danger { background: var(--bad); }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  select, input {
    background: #0f1115; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.45rem 0.6rem; font-size: 0.85rem;
  }
  label { color: var(--muted); font-size: 0.8rem; }
  .panel {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem;
  }
  #msg { min-height: 1.2em; font-size: 0.85rem; }
</style>
</head>
<body>
<h1>Iveras Install Registry</h1>
<p class="sub">Telemetry &amp; license server — alle geregistreerde installaties</p>

<div>
  <div class="stat"><b id="count">-</b><span>installs</span></div>
  <div class="stat"><b id="online">-</b><span>online &le; 48u</span></div>
  <div class="stat"><b id="stale">-</b><span>stale &gt; 48u</span></div>
</div>

<div class="panel">
  <b style="display:block;margin-bottom:0.6rem;">Issue license</b>
  <div style="display:flex;gap:0.7rem;flex-wrap:wrap;align-items:flex-end;">
    <label>Install<br><select id="issue-install" style="min-width:14rem;"></select></label>
    <label>Plan<br>
      <select id="issue-plan">
        <option value="full">full</option>
        <option value="trial">trial</option>
      </select>
    </label>
    <label>Days<br><input id="issue-days" type="number" value="365" min="1" max="3650"></label>
    <label>Expires (opt.)<br><input id="issue-expires" type="date"></label>
    <button id="issue-btn">Issue</button>
  </div>
  <p id="msg" class="muted"></p>
</div>

<table>
  <thead>
    <tr>
      <th>Status</th>
      <th>Install ID</th>
      <th>Host</th>
      <th>IP</th>
      <th>System</th>
      <th>HW</th>
      <th>App</th>
      <th>Platform</th>
      <th>License</th>
      <th>Actions</th>
      <th>Registered</th>
      <th>Last seen</th>
    </tr>
  </thead>
  <tbody id="rows">
    <tr><td colspan="12" class="muted">Loading…</td></tr>
  </tbody>
</table>

<p id="updated"></p>
<button id="refresh">Refresh</button>

<script>
  var CSRF_TOKEN = "{{ csrf_token }}";
  function esc(s) {
    if (s === null || s === undefined) return "";
    return String(s).replace(/[&<>"']/g, function (c) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function ago(iso) {
    if (!iso) return "-";
    var t = Date.parse(iso);
    if (isNaN(t)) return "-";
    var d = Math.floor((Date.now() - t) / 60000);
    if (d < 1) return "now";
    if (d < 60) return d + "m";
    var h = Math.floor(d / 60);
    if (h < 48) return h + "h";
    return Math.floor(h / 24) + "d";
  }
  function full(iso) {
    return iso ? new Date(iso).toLocaleString() : "-";
  }
  function licCell(lic) {
    if (!lic) return '<td class="small">-</td>';
    var status = esc(lic.status || "active");
    var color = lic.status === "revoked" ? "var(--bad)" : (lic.status === "expired" ? "var(--warn)" : "var(--ok)");
    return '<td class="small"><span style="color:' + color + '">●</span> ' +
      esc(lic.plan || "-") + " · " + status +
      (lic.expires_at ? '<br><span class="muted">' + esc(lic.expires_at) + '</span>' : "") +
      '</td>';
  }
  function actionCell(it) {
    var actions = "";
    if (it.license && it.license.status !== "revoked") {
      actions += '<button class="danger" onclick="revokeLicense(\'' + esc(it.install_id) + '\')">Revoke</button>';
    }
    actions += '<button class="danger" onclick="deleteInstall(\'' + esc(it.install_id) + '\')">Delete</button>';
    return '<td>' + actions + '</td>';
  }
  function showMsg(text, ok) {
    var el = document.getElementById("msg");
    el.textContent = text;
    el.style.color = ok ? "var(--ok)" : "var(--bad)";
  }
  function postAction(url, data) {
    var fd = new FormData();
    Object.keys(data).forEach(function (k) { fd.append(k, data[k]); });
    return fetch(url, { method: "POST", body: fd, headers: { "X-CSRF-Token": CSRF_TOKEN } })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (b) {
          if (!r.ok) throw new Error(b.message || r.status);
          return b;
        });
      });
  }
  function issueLicense() {
    var install = document.getElementById("issue-install").value;
    if (!install) { showMsg("Select an install", false); return; }
    var btn = document.getElementById("issue-btn");
    btn.disabled = true;
    postAction("/license/issue", {
      install_id: install,
      plan: document.getElementById("issue-plan").value,
      days: document.getElementById("issue-days").value,
      expires: document.getElementById("issue-expires").value,
    })
      .then(function (b) {
        showMsg("License " + b.license.plan + " issued for " + install +
          " (expires " + b.license.expires_at + ")", true);
        load();
      })
      .catch(function (e) { showMsg("Issue failed: " + e.message, false); })
      .then(function () { btn.disabled = false; });
  }
  function revokeLicense(install) {
    if (!confirm("Revoke license for " + install + "?")) return;
    postAction("/license/revoke", { install_id: install })
      .then(function (b) {
        showMsg(b.revoked ? "License revoked for " + install : "No active license for " + install, true);
        load();
      })
      .catch(function (e) { showMsg("Revoke failed: " + e.message, false); });
  }
  function deleteInstall(install) {
    if (!confirm("DELETE install " + install + " and its licenses?\nThis cannot be undone.")) return;
    postAction("/license/delete", { install_id: install })
      .then(function (b) {
        showMsg("Install " + install + " deleted", true);
        load();
      })
      .catch(function (e) { showMsg("Delete failed: " + e.message, false); });
  }
  function load() {
    fetch("/api/installs")
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        var rows = data.installs || [];
        var now = Date.now();
        var online = 0, stale = 0;
        rows.forEach(function (it) {
          var t = Date.parse(it.last_seen || it.registered_at || "");
          if (isNaN(t)) t = Date.now();
          var hours = (now - t) / 3600000;
          if (hours <= 48) online++; else stale++;
        });
        document.getElementById("count").textContent = rows.length;
        document.getElementById("online").textContent = online;
        document.getElementById("stale").textContent = stale;

        var sel = document.getElementById("issue-install");
        var prev = sel.value;
        sel.innerHTML = "";
        rows.forEach(function (it) {
          var o = document.createElement("option");
          o.value = it.install_id;
          o.textContent = it.install_id;
          sel.appendChild(o);
        });
        if (prev && Array.prototype.some.call(sel.options, function (o) { return o.value === prev; })) {
          sel.value = prev;
        }
        document.getElementById("issue-btn").disabled = rows.length === 0;

        var tb = document.getElementById("rows");
        tb.innerHTML = rows.length ? "" :
          '<tr><td colspan="12" class="muted">No installs registered yet.</td></tr>';

        rows.forEach(function (it) {
          var t = Date.parse(it.last_seen || "");
          if (isNaN(t)) t = Date.now();
          var hours = (now - t) / 3600000;
          var cls = hours <= 48 ? "ok" : (hours <= 240 ? "warn" : "bad");
          var tr = document.createElement("tr");
          tr.innerHTML =
            '<td><span class="dot ' + cls + '"></span>' + ago(it.last_seen) + '</td>' +
            '<td class="wrap small">' + esc(it.install_id) + '</td>' +
            '<td>' + esc(it.hostname || "-") + '</td>' +
            '<td class="small">' + esc(it.public_ip || "-") +
              (it.local_ips && it.local_ips.length ? '<br><span class="muted">' + it.local_ips.map(esc).join(", ") + '</span>' : "") +
            '</td>' +
            '<td class="small">' + esc(it.os_name || "-") + ' ' + esc(it.os_version || "") +
              '<br><span class="muted">' + esc(it.kernel || "") + '</span></td>' +
            '<td class="small">' + esc(it.cpu_model || "-") +
              (it.cpu_count ? ' (' + it.cpu_count + ')' : "") +
              '<br><span class="muted">' + (it.ram_gb || "-") + ' GB RAM · ' + (it.disk_gb || "-") + ' GB disk</span></td>' +
            '<td>' + esc(it.app_version || "-") + '</td>' +
            '<td>' + esc(it.platform || "-") + '</td>' +
            licCell(it.license) +
            actionCell(it) +
            '<td class="small" title="' + full(it.registered_at) + '">' + ago(it.registered_at) + '</td>' +
            '<td class="small" title="' + full(it.last_seen) + '">' + ago(it.last_seen) + '</td>';
          tb.appendChild(tr);
        });
        document.getElementById("updated").textContent =
          "Updated " + new Date().toLocaleTimeString() + " (server: " + (data.now || "") + ")";
      })
      .catch(function (e) {
        document.getElementById("rows").innerHTML =
          '<tr><td colspan="12" class="muted">Failed to load: ' + esc(e.message) + '</td></tr>';
      });
  }
  document.getElementById("refresh").addEventListener("click", load);
  document.getElementById("issue-btn").addEventListener("click", issueLicense);
  load();
  setInterval(load, 60000);
</script>
</body>
</html>
