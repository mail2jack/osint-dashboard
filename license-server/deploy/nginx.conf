# Start minimal (port 80 only) — run `certbot --nginx -d license.iveras.com`
# afterwards; certbot adds the TLS server block and the 80→443 redirect.
server {
    listen 80;
    server_name license.iveras.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Do not preserve client-supplied XFF: Flask trusts this header from nginx.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
